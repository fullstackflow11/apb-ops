<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="apb-roles.js"></script>
<script src="apb-demo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Updates · APB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEEF2;--panel:#fff;--panel-2:#F5F6FA;
  --ink:#0D1626;--ink-2:#3A4559;--ink-3:#6B7A92;
  --line:#DDE1E8;--line-2:#E8EBF0;
  --accent:#2457E6;--accent-2:#1B45B8;--accent-soft:#EAF0FE;
  --green:#0B9E6A;--green-soft:#E4F5EE;
  --amber:#B86A00;--amber-soft:#FBF0E2;
  --red:#C43030;--red-soft:#FDEAEA;
  --purple:#6B3DBB;--purple-soft:#F0EBFF;
  --shadow-sm:0 1px 3px rgba(13,22,38,.07);
  --shadow:0 8px 28px -12px rgba(13,22,38,.14);
  --mono:"DM Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(14px);display:flex;align-items:center;gap:14px;padding:0 28px;height:62px;border-bottom:1px solid var(--line)}
.topbar img{height:46px;width:auto;display:block}
.topbar .t{border-left:1px solid var(--line);padding-left:14px}
.topbar .t b{font-size:15px}
.topbar .t span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.topbar .sp{flex:1}
.topbar .navbtn{font-size:12.5px;font-weight:600;color:var(--accent);padding:7px 13px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;text-decoration:none;transition:.12s;white-space:nowrap}
.topbar .navbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.role-pill{font-family:var(--mono);font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent-2);letter-spacing:.04em}
.whoami{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3)}
.whoami select{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
.wrap{max-width:920px;margin:0 auto;padding:24px 22px 60px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);padding:20px 22px}
.form-card h2{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.form-card .sub{font-size:12.5px;color:var(--ink-3);margin:0 0 16px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fg label{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.fg input,.fg select,.fg textarea{font:inherit;font-size:13.5px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);outline:none;transition:.12s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,87,230,.1)}
.fg textarea{resize:vertical;min-height:90px;line-height:1.5}
.f2{display:grid;grid-template-columns:2fr 1fr;gap:13px}
.dz{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:11px;padding:18px;text-align:center;color:var(--ink-3);cursor:pointer;background:var(--panel-2);transition:.15s;font-size:13px}
.dz:hover,.dz.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.dz b{color:var(--ink)}
.thumbs{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}
.thumb{position:relative;width:84px;height:64px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border:none;border-radius:6px;background:rgba(13,22,38,.6);color:#fff;font-size:13px;line-height:1;cursor:pointer}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);transition:.12s;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.prim:hover{background:var(--accent-2);color:#fff}

.sec{display:flex;align-items:center;gap:12px;margin:28px 2px 14px}
.sec h2{font-size:15px;font-weight:800;letter-spacing:-.02em;margin:0}
.sec .sp{flex:1}
.tabs{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.tabs button{font:inherit;font-size:12.5px;font-weight:600;padding:6px 13px;border:none;border-radius:8px;background:transparent;color:var(--ink-3);cursor:pointer;transition:.12s}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}
.feed-sel{font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.feed-count{font-size:12px;color:var(--ink-3)}

#feed{display:grid;gap:14px}
.rpt{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);padding:15px 17px;border-left:3px solid var(--accent)}
.rpt-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.rpt-av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.rpt-who b{font-size:13.5px;font-weight:700}
.rpt-who .meta{font-size:11.5px;color:var(--ink-3)}
.rpt-proj{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent-2);background:var(--accent-soft);padding:4px 11px;border-radius:20px;white-space:nowrap}
.rpt-status{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:6px;margin-left:8px}
.st-track{background:var(--green-soft);color:#0a7a52}.st-parts,.st-cust{background:var(--amber-soft);color:var(--amber)}.st-block{background:var(--red-soft);color:var(--red)}.st-done{background:var(--accent-soft);color:var(--accent-2)}
.rpt-text{font-size:13.5px;color:var(--ink);line-height:1.55;margin:0 0 11px;white-space:pre-wrap}
.rpt-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.rpt-photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
.rpt-actions{display:flex;gap:8px;margin-top:11px;border-top:1px solid var(--line-2);padding-top:10px}
.ra{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);cursor:pointer;transition:.12s;text-decoration:none}
.ra:hover{border-color:var(--accent);color:var(--accent)}
.ra.del{margin-left:auto}.ra.del:hover{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.empty{text-align:center;padding:50px 20px;color:var(--ink-3)}
.empty svg{width:44px;height:44px;stroke:var(--line);stroke-width:1.5;display:block;margin:0 auto 14px}

.lb{display:none;position:fixed;inset:0;background:rgba(8,12,22,.9);z-index:100;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:10px}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(70px);background:#11151c;color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:500;z-index:90;opacity:0;transition:.25s;pointer-events:none}
.toast.show{transform:translateX(-50%);opacity:1}
.toast.green{background:#0a7a52}.toast.red{background:var(--red)}
@media(max-width:680px){.f2{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="apb-theme.css">
</head>
<body>

<header class="topbar">
  <img src="apb-logo.png" alt="APB">
  <div class="t"><b>Field Updates</b><span>Project status from the crew</span></div>
  <div class="sp"></div>
  <div class="whoami" id="whoami"></div>
  <span class="role-pill" id="rolePill">—</span>
  <button class="navbtn" onclick="exportBackup()" title="Download every field update (incl. photos) as a backup file">⬇ Backup</button>
  <a class="navbtn" href="index.html">⌂ Home</a>
</header>

<main class="wrap">
  <div class="card form-card">
    <h2>Log a status update</h2>
    <p class="sub">Quick note on what's happening on a project, with photos — saved under that project. (Internal — not sent to the customer; it feeds the report we build for them.)</p>
    <div class="f2">
      <div class="fg"><label>Project *</label><input id="fProject" list="projList" placeholder="Pick or type a project…" autocomplete="off"><datalist id="projList"></datalist></div>
      <div class="fg"><label>How's it going</label><select id="fStatus">
        <option value="track">On track</option>
        <option value="parts">Waiting on parts</option>
        <option value="cust">Waiting on customer</option>
        <option value="block">Blocked / issue</option>
        <option value="done">Done</option>
      </select></div>
    </div>
    <div class="fg"><label>What happened *</label><textarea id="fText" placeholder="What got done today, what's next, anything the office should know…"></textarea></div>
    <div class="fg"><label>Photos</label>
      <label class="dz" id="dz"><input type="file" id="fileInput" accept="image/*" multiple style="display:none">📷 <b style="margin:0 4px">Add photos</b> — drag &amp; drop or tap</label>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="form-actions"><button class="btn prim" onclick="submitReport()">Submit update</button><span id="photoNote" class="feed-count"></span></div>
  </div>

  <div class="sec">
    <div class="tabs"><button id="tabAll" class="on" onclick="setFilter('all')">All updates</button><button id="tabMine" onclick="setFilter('mine')">Mine</button></div>
    <select class="feed-sel" id="projFilter" onchange="renderFeed()"><option value="">All projects</option></select>
    <span class="sp"></span>
    <span class="feed-count" id="feedCount"></span>
  </div>
  <div id="feed"></div>
</main>

<div class="lb" id="lb" onclick="closeLb()"><img id="lbImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
const LS_RPT='apb_field_reports', LS_TEAM='apb_team', LS_ME='apb_me', LS_JOBS='apb_jobs_cache';
const role=(window.APBRoles?APBRoles.role():'admin');
const SEED_TEAM=[{name:'Jerry Clark',role:'tech'},{name:'Tommy Borden',role:'tech'},{name:'Christian Yancy',role:'tech'},{name:'Jared Sandoval',role:'tech'},{name:'Jesse Lopez Sanchez',role:'tech'},{name:'Jordan Mirador',role:'tech'},{name:'David Brown',role:'tech'},{name:'Brandon Wezkiewicz',role:'tech'}];
const STATUS_LABEL={track:'On track',parts:'Waiting on parts',cust:'Waiting on customer',block:'Blocked / issue',done:'Done'};
const STATUS_CLS={track:'st-track',parts:'st-parts',cust:'st-cust',block:'st-block',done:'st-done'};
let pending=[];   // photos staged for the current update (declared early to avoid TDZ)

function load(k,f){ try{ return JSON.parse(localStorage.getItem(k)||f); }catch(e){ return JSON.parse(f); } }
function save(k,v){ localStorage.setItem(k,JSON.stringify(v)); }
function reports(){ return load(LS_RPT,'[]'); }
function team(){ let t=load(LS_TEAM,'null'); if(!t){ t=SEED_TEAM.slice(); save(LS_TEAM,t); } return t; }
function me(){ return localStorage.getItem(LS_ME)||''; }
function setMe(n){ localStorage.setItem(LS_ME,n); renderFeed(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// ── Shared store (Supabase) — field updates sync to apb_field_reports so every computer sees them ──
const SUPABASE_URL='https://aanrxyiocxxndkvkeocv.supabase.co';
const SUPABASE_KEY='sb_publishable_DzUy57K8eF8I1HeAYrCz3A_G7aEiyCw';
let sb=null; try{ sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){}
async function reportUpsert(r){ if(!sb||!r||!r.id) return; try{ await sb.from('apb_field_reports').upsert({id:r.id,data:r,updated_at:new Date().toISOString()}); }catch(e){} }
async function reportDelete(id){ if(!sb||!id) return; try{ await sb.from('apb_field_reports').delete().eq('id',id); }catch(e){} }
async function syncPull(){
  if(!sb) return;
  try{
    const {data,error}=await sb.from('apb_field_reports').select('id,data');
    if(error) return;
    const byId={};
    (data||[]).forEach(x=>{ if(x&&x.data&&x.data.id) byId[x.data.id]=x.data; });
    reports().forEach(r=>{ if(r&&r.id&&!byId[r.id]){ byId[r.id]=r; reportUpsert(r); } });
    save(LS_RPT, Object.values(byId).sort((a,b)=>(b.at||0)-(a.at||0)));
    renderFeed();
  }catch(e){}
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function initials(n){ const p=(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase(); }
function timeAgo(ts){ const s=(Date.now()-ts)/1000; if(s<60)return'just now'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; const d=Math.floor(s/86400); if(d<7)return d+'d ago'; return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

function projects(){
  var set={};
  load(LS_JOBS,'[]').forEach(function(j){ if(j&&j.project&&!j.lead) set[j.project]=1; });
  reports().forEach(function(r){ if(r.project) set[r.project]=1; });
  return Object.keys(set).sort();
}

document.getElementById('rolePill').textContent=window.APBRoles?APBRoles.label():'Admin';

function renderWhoAmI(){
  document.getElementById('whoami').innerHTML='You: <select onchange="setMe(this.value)"><option value="">— your name —</option>'+
    team().map(m=>`<option value="${esc(m.name)}" ${m.name===me()?'selected':''}>${esc(m.name)}</option>`).join('')+'</select>';
}
function fillProjects(){
  const ps=projects();
  document.getElementById('projList').innerHTML=ps.map(p=>`<option value="${esc(p)}">`).join('');
  const sel=document.getElementById('projFilter'); const cur=sel.value;
  sel.innerHTML='<option value="">All projects</option>'+ps.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
  if(ps.indexOf(cur)>=0) sel.value=cur;
}

// ── photo upload (resize to keep storage small) ──
function resizeImage(file){ return new Promise(function(res){
  const img=new Image();
  img.onload=function(){ let w=img.naturalWidth,h=img.naturalHeight,max=1100;
    if(w>h&&w>max){h=Math.round(h*max/w);w=max;} else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    res(c.toDataURL('image/jpeg',0.72)); URL.revokeObjectURL(img.src); };
  img.onerror=function(){ res(null); };
  img.src=URL.createObjectURL(file);
}); }
async function addFiles(files){
  for(const f of files){
    if(pending.length>=8){ toast('8 photos max per update','red'); break; }
    if(f.type.indexOf('image/')!==0) continue;
    const d=await resizeImage(f); if(d) pending.push(d);
  }
  renderThumbs();
}
function renderThumbs(){
  document.getElementById('thumbs').innerHTML=pending.map((d,i)=>`<div class="thumb"><img src="${d}"><button class="rm" onclick="rmThumb(${i})">✕</button></div>`).join('');
  document.getElementById('photoNote').textContent=pending.length?pending.length+' photo'+(pending.length>1?'s':'')+' attached':'';
}
function rmThumb(i){ pending.splice(i,1); renderThumbs(); }
(function(){
  const dz=document.getElementById('dz'), inp=document.getElementById('fileInput');
  inp.addEventListener('change',e=>{ addFiles(e.target.files); e.target.value=''; });
  dz.addEventListener('dragover',e=>{ e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{ e.preventDefault(); dz.classList.remove('over'); if(e.dataTransfer&&e.dataTransfer.files) addFiles(e.dataTransfer.files); });
})();

function submitReport(){
  const project=document.getElementById('fProject').value.trim();
  const text=document.getElementById('fText').value.trim();
  if(!project){ toast('Pick a project','red'); document.getElementById('fProject').focus(); return; }
  if(!text){ toast('Add a quick update','red'); document.getElementById('fText').focus(); return; }
  const author=me()||APBRoles.label();
  const r={ id:uid(), project, author, role, status:document.getElementById('fStatus').value,
    text, photos:pending.slice(), at:Date.now() };
  const all=reports(); all.unshift(r);
  try{ save(LS_RPT,all); }catch(e){ toast('Storage full — remove some photos','red'); return; }
  reportUpsert(r);
  pending=[]; renderThumbs();
  document.getElementById('fText').value='';
  fillProjects(); renderFeed();
  toast('Update posted to '+project+' ✓','green');
}

let filter='all';
function setFilter(f){ filter=f; document.getElementById('tabAll').classList.toggle('on',f==='all'); document.getElementById('tabMine').classList.toggle('on',f==='mine'); renderFeed(); }

function renderFeed(){
  let all=reports();
  const pf=document.getElementById('projFilter').value;
  if(filter==='mine'&&me()) all=all.filter(r=>r.author===me());
  if(pf) all=all.filter(r=>r.project===pf);
  const feed=document.getElementById('feed');
  document.getElementById('feedCount').textContent=all.length?all.length+' update'+(all.length>1?'s':''):'';
  if(!all.length){ feed.innerHTML=`<div class="empty"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9a2 2 0 0 1 2-2h2l1-2h8l1 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3"/></svg><p>No updates yet${filter==='mine'?" from you":""}. Post the first one above.</p></div>`; return; }
  feed.innerHTML=all.map(r=>{
    const photos=(r.photos&&r.photos.length)?`<div class="rpt-photos">${r.photos.map(p=>`<img src="${p}" onclick="openLb('${r.id}',${r.photos.indexOf(p)})">`).join('')}</div>`:'';
    const stat=r.status?`<span class="rpt-status ${STATUS_CLS[r.status]||''}">${STATUS_LABEL[r.status]||r.status}</span>`:'';
    const canDel=(role==='admin'||r.author===me());
    return `<div class="rpt">
      <div class="rpt-top">
        <div class="rpt-av">${initials(r.author)}</div>
        <div class="rpt-who"><b>${esc(r.author)}</b>${stat}<div class="meta">${timeAgo(r.at)}</div></div>
        <span class="rpt-proj">⚓ ${esc(r.project)}</span>
      </div>
      <p class="rpt-text">${esc(r.text)}</p>
      ${photos}
      <div class="rpt-actions">
        <a class="ra" href="apb-pm.html" title="Open the project to build a customer report">Use in customer report →</a>
        ${canDel?`<button class="ra del" onclick="delReport('${r.id}')">Delete</button>`:''}
      </div>
    </div>`;
  }).join('');
}
function delReport(id){ if(!confirm('Delete this update?')) return; save(LS_RPT, reports().filter(r=>r.id!==id)); reportDelete(id); renderFeed(); toast('Deleted','red'); }

let lbList=[],lbIdx=0;
function openLb(rid,idx){ const r=reports().find(x=>x.id===rid); if(!r) return; lbList=r.photos; lbIdx=idx; document.getElementById('lbImg').src=lbList[idx]; document.getElementById('lb').classList.add('open'); }
function closeLb(){ document.getElementById('lb').classList.remove('open'); }

let toastT;
function toast(msg,cls){ const el=document.getElementById('toast'); el.textContent=msg; el.className='toast show'+(cls?' '+cls:''); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600); }

// Download every synced field update (incl. photos) as a JSON backup file.
function exportBackup(){
  const all=reports();
  const payload={ table:'apb_field_reports', exported_at:new Date().toISOString(), count:all.length, reports:all };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download='apb-field-updates-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1500);
  toast('Backup downloaded — '+all.length+' update'+(all.length===1?'':'s'),'green');
}

// init (after all declarations exist)
renderWhoAmI(); fillProjects(); renderFeed();
syncPull();
</script>
</body>
</html>
