<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APB — Timesheet Review</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #000; --card: #0c0c0e; --card2: #141417; --border: #2a2a2e; --border-bright: #3a3a40;
    --silver: #c8ccd2; --silver-bright: #e8ebef; --silver-dim: #8a8e96;
    --metal: linear-gradient(135deg, #d8dce2 0%, #9a9ea6 45%, #c0c4ca 55%, #7a7e86 100%);
    --text: #f4f5f7; --muted: #72767e; --input-bg: #111114;
    --green: #4ac078; --red: #d84848; --amber: #d8a048; --blue: #2a9fd8;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo .bar { width: 4px; height: 28px; background: var(--metal); border-radius: 2px; }
  .logo h1 { font-family: 'DM Mono', monospace; font-size: 16px; letter-spacing: 3px; background: var(--metal); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .logo p { font-size: 10px; color: var(--silver-dim); letter-spacing: 2px; }
  .header-right { display: flex; gap: 10px; align-items: center; }
  .btn { padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; font-family: 'DM Sans', sans-serif; }
  .btn-ghost { background: var(--input-bg); border: 1px solid var(--border-bright); color: var(--silver-dim); }
  .btn-primary { background: var(--metal); color: #000; }
  .btn-danger { background: rgba(216,72,72,.15); border: 1px solid rgba(216,72,72,.3); color: var(--red); }
  main { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }
  .filters { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--silver-dim); letter-spacing: 1px; }
  .filter-select { background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 12px; font-size: 13px; -webkit-appearance: none; cursor: pointer; }
  .filter-chip { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--input-bg); color: var(--silver-dim); transition: all .15s; }
  .filter-chip.active { border-color: var(--silver); color: var(--silver-bright); background: rgba(200,204,210,.08); }
  .summary-bar { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; display: flex; gap: 12px; align-items: center; }
  .stat-val { font-family: 'DM Mono', monospace; font-size: 22px; color: var(--silver-bright); }
  .stat-label { font-size: 11px; color: var(--muted); }
  .visits { display: flex; flex-direction: column; gap: 16px; }
  .visit-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .visit-head { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
  .visit-head:hover { background: var(--card2); }
  .visit-vessel { font-weight: 600; font-size: 15px; color: var(--silver-bright); flex: 1; }
  .visit-tech { font-family: 'DM Mono', monospace; font-size: 11px; background: var(--input-bg); border: 1px solid var(--border); padding: 3px 8px; border-radius: 4px; color: var(--silver); }
  .visit-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
  .visit-hours { font-family: 'DM Mono', monospace; font-size: 15px; color: var(--silver-bright); }
  .visit-chevron { color: var(--muted); font-size: 12px; transition: transform .2s; }
  .visit-card.open .visit-chevron { transform: rotate(180deg); }
  .visit-body { display: none; padding: 0 18px 16px; }
  .visit-card.open .visit-body { display: block; }
  .lines-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  .lines-table th { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; color: var(--silver-dim); text-transform: uppercase; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .lines-table td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  .lines-table tr:last-child td { border-bottom: none; }
  .lines-table tr:hover td { background: var(--card2); }
  .job-no { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--silver); white-space: nowrap; }
  .work-desc { color: var(--text); line-height: 1.5; max-width: 480px; }
  .hours-cell { font-family: 'DM Mono', monospace; font-size: 14px; color: var(--silver-bright); white-space: nowrap; }
  .billable-toggle { display: flex; align-items: center; gap: 6px; }
  .toggle { position: relative; width: 40px; height: 22px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: var(--border-bright); border-radius: 11px; cursor: pointer; transition: .2s; }
  .toggle-slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: var(--silver-dim); border-radius: 50%; transition: .2s; }
  .toggle input:checked + .toggle-slider { background: rgba(74,192,120,.3); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(18px); background: var(--green); }
  .billable-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; }
  .billable-label.yes { color: var(--green); }
  .billable-label.no { color: var(--muted); }
  .reviewed-btn { padding: 5px 10px; border-radius: 5px; font-size: 11px; font-weight: 600; cursor: pointer; border: none; font-family: 'DM Mono', monospace; letter-spacing: .5px; }
  .reviewed-btn.done { background: rgba(74,192,120,.12); color: var(--green); border: 1px solid rgba(74,192,120,.3); }
  .reviewed-btn.pending { background: var(--input-bg); color: var(--muted); border: 1px solid var(--border); }
  .empty-state { text-align: center; color: var(--muted); padding: 60px; font-size: 14px; line-height: 1.8; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--silver); border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--card2); border: 1px solid var(--border-bright); border-radius: 10px; padding: 12px 18px; font-size: 13px; color: var(--text); z-index: 9999; display: none; }
  .toast.show { display: block; }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="bar"></div><div><h1>APB TIMESHEET REVIEW</h1><p>MANAGER · ADMIN</p></div></div>
  <div class="header-right">
    <a href="apb-dashboard.html" class="btn btn-ghost">← Dashboard</a>
    <button class="btn btn-ghost" onclick="loadData()">↻ Refresh</button>
  </div>
</header>

<main>
  <div class="summary-bar" id="summaryBar">
    <div class="stat"><div class="stat-val" id="statVisits">—</div><div><div class="stat-label">Visits</div></div></div>
    <div class="stat"><div class="stat-val" id="statLines">—</div><div><div class="stat-label">Job Lines</div></div></div>
    <div class="stat"><div class="stat-val" id="statHours">—</div><div><div class="stat-label">Total Hours</div></div></div>
    <div class="stat"><div class="stat-val" id="statPending" style="color:var(--amber)">—</div><div><div class="stat-label">Pending Review</div></div></div>
    <div class="stat"><div class="stat-val" id="statReviewed" style="color:var(--green)">—</div><div><div class="stat-label">Reviewed</div></div></div>
  </div>
  <div class="filters">
    <span class="filter-label">FILTER</span>
    <div class="filter-chip active" onclick="setFilter('all', this)">All</div>
    <div class="filter-chip" onclick="setFilter('pending', this)">Pending Review</div>
    <div class="filter-chip" onclick="setFilter('reviewed', this)">Reviewed</div>
    <select class="filter-select" id="techFilter" onchange="renderVisits()"><option value="">All Techs</option></select>
    <select class="filter-select" id="vesselFilter" onchange="renderVisits()"><option value="">All Vessels</option></select>
  </div>
  <div id="visitList"><div class="spinner"></div></div>
</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://aanrxyiocxxndkvkeocv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DzUy57K8eF8I1HeAYrCz3A_G7aEiyCw';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SYNTHETIC_DOMAIN = 'apb-techs.local';
const _gate = document.createElement('div');
_gate.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#000;font-family:inherit;';
_gate.innerHTML = '<div style="width:340px;max-width:90vw;border:1px solid #2a2a2e;border-radius:14px;padding:32px 28px;background:#0c0c0e;">' +
  '<div style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c8ccd2;margin-bottom:6px;">APB Timesheet Review</div>' +
  '<div style="font-size:20px;font-weight:700;color:#e8ebef;margin-bottom:18px;">Manager Sign In</div>' +
  '<label style="display:block;font-size:12px;color:#8a8e96;margin-bottom:4px;">Name / ID or email</label>' +
  '<input id="apb-id" type="text" autocapitalize="none" style="width:100%;box-sizing:border-box;padding:11px 12px;margin-bottom:12px;border-radius:8px;border:1px solid #3a3a40;background:#111114;color:#f4f5f7;font-size:14px;outline:none;"/>' +
  '<label style="display:block;font-size:12px;color:#8a8e96;margin-bottom:4px;">PIN</label>' +
  '<input id="apb-pin" type="password" inputmode="numeric" style="width:100%;box-sizing:border-box;padding:11px 12px;margin-bottom:16px;border-radius:8px;border:1px solid #3a3a40;background:#111114;color:#f4f5f7;font-size:18px;letter-spacing:.25em;outline:none;"/>' +
  '<button id="apb-go" style="width:100%;padding:11px;border:none;border-radius:8px;cursor:pointer;background:linear-gradient(135deg,#d8dce2,#9a9ea6);color:#000;font-size:14px;font-weight:700;">Continue</button>' +
  '<div id="apb-msg" style="margin-top:12px;font-size:12.5px;color:#d84848;min-height:16px;"></div></div>';
document.body.appendChild(_gate);
function _normId(raw){ const v=(raw||'').trim().toLowerCase(); if(!v)return null; return v.includes('@')?v:v.replace(/\s+/g,'.')+'@'+SYNTHETIC_DOMAIN; }
const _id=_gate.querySelector('#apb-id'),_pin=_gate.querySelector('#apb-pin'),_go=_gate.querySelector('#apb-go'),_msg=_gate.querySelector('#apb-msg');
async function _enter(){ const email=_normId(_id.value),pin=_pin.value; if(!email){_msg.textContent='Enter your name or ID.';return;} if(!pin){_msg.textContent='Enter your PIN.';return;} _go.disabled=true;_go.textContent='...';
  try{ const{error}=await sb.auth.signInWithPassword({email,password:pin}); if(error)throw error; }catch(e){_msg.textContent='Wrong name/ID or PIN.';} finally{_go.disabled=false;_go.textContent='Continue';} }
_go.addEventListener('click',_enter); _gate.addEventListener('keydown',e=>{if(e.key==='Enter')_enter();});
let _booted=false;
function _unlock(){ if(_booted)return; _booted=true; _gate.remove(); loadData();
  const so=document.createElement('button'); so.textContent='Sign out'; so.className='btn btn-ghost'; so.style.cssText='position:fixed;top:14px;right:14px;z-index:9000;'; so.onclick=async()=>{await sb.auth.signOut();location.reload();}; document.body.appendChild(so); }
sb.auth.onAuthStateChange((_e,s)=>{ if(s)_unlock(); });
sb.auth.getSession().then(({data})=>{ if(data&&data.session)_unlock(); });

let visits = [], lines = [], currentFilter = 'all';

async function loadData() {
  document.getElementById('visitList').innerHTML = '<div class="spinner"></div>';
  const [vRes, lRes] = await Promise.all([
    sb.from('apb_timesheets').select('*, apb_engagements(name)').order('visit_date', {ascending:false}).limit(200),
    sb.from('apb_timesheet_lines').select('*, apb_jobs(job_name, job_number)').order('created_at', {ascending:true})
  ]);
  visits = vRes.data || [];
  lines = lRes.data || [];
  const techs = [...new Set(visits.map(v=>v.tech_name))].sort();
  const vessels = [...new Set(visits.map(v=>v.apb_engagements?.name || v.vessel_name || ''))].filter(Boolean).sort();
  document.getElementById('techFilter').innerHTML = '<option value="">All Techs</option>' + techs.map(t=>`<option>${t}</option>`).join('');
  document.getElementById('vesselFilter').innerHTML = '<option value="">All Vessels</option>' + vessels.map(v=>`<option>${v}</option>`).join('');
  updateSummary();
  renderVisits();
}

function updateSummary() {
  const totalHours = visits.reduce((s,v)=>s+parseFloat(v.total_hours||0),0);
  const pending = lines.filter(l=>!l.reviewed).length;
  const reviewed = lines.filter(l=>l.reviewed).length;
  document.getElementById('statVisits').textContent = visits.length;
  document.getElementById('statLines').textContent = lines.length;
  document.getElementById('statHours').textContent = totalHours.toFixed(1);
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statReviewed').textContent = reviewed;
}

function setFilter(f, el) { currentFilter = f; document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active')); el.classList.add('active'); renderVisits(); }

function renderVisits() {
  const techF = document.getElementById('techFilter').value;
  const vesselF = document.getElementById('vesselFilter').value;
  let filtered = visits.filter(v => {
    if (techF && v.tech_name !== techF) return false;
    const vName = v.apb_engagements?.name || v.vessel_name || '';
    if (vesselF && vName !== vesselF) return false;
    const vLines = lines.filter(l=>l.timesheet_id===v.id);
    if (currentFilter === 'pending') return vLines.some(l=>!l.reviewed);
    if (currentFilter === 'reviewed') return vLines.length && vLines.every(l=>l.reviewed);
    return true;
  });
  if (!filtered.length) { document.getElementById('visitList').innerHTML = '<div class="empty-state">No entries match.</div>'; return; }
  document.getElementById('visitList').innerHTML = '<div class="visits">' + filtered.map(v => {
    const vLines = lines.filter(l=>l.timesheet_id===v.id);
    const allReviewed = vLines.length && vLines.every(l=>l.reviewed);
    const photos = v.photo_urls ? v.photo_urls.split(',').filter(Boolean) : [];
    const dateStr = v.visit_date ? new Date(v.visit_date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}) : '—';
    const vesselName = v.apb_engagements?.name || v.vessel_name || '—';
    const linesHtml = vLines.length ? `
      <table class="lines-table">
        <thead><tr><th>Job</th><th>Description of Work</th><th>Hours</th><th>Billable</th><th>Status</th></tr></thead>
        <tbody>${vLines.map(l=>`
          <tr>
            <td><span class="job-no">${l.apb_jobs?.job_number||''} ${l.apb_jobs?.job_name||''}</span></td>
            <td><span class="work-desc">${l.work_description||''}</span></td>
            <td><span class="hours-cell">${parseFloat(l.hours||0).toFixed(1)}h</span></td>
            <td><div class="billable-toggle"><label class="toggle"><input type="checkbox" ${l.billable!==false?'checked':''} onchange="toggleBillable('${l.id}', this.checked)"><span class="toggle-slider"></span></label><span class="billable-label ${l.billable!==false?'yes':'no'}">${l.billable!==false?'BILL':'NON'}</span></div></td>
            <td><button class="reviewed-btn ${l.reviewed?'done':'pending'}" onclick="toggleReviewed('${l.id}', ${!l.reviewed}, this)">${l.reviewed?'✓ REVIEWED':'MARK DONE'}</button></td>
          </tr>`).join('')}
        </tbody>
      </table>` : `<div style="padding:12px 0;font-size:13px;color:var(--muted);">No line items</div>`;
    return `<div class="visit-card ${allReviewed?'open':''}">
      <div class="visit-head" onclick="toggleCard(this)">
        <div class="visit-vessel">${vesselName}</div>
        <span class="visit-tech">${v.tech_name}</span>
        <span class="visit-date">${dateStr}</span>
        <span class="visit-hours">${parseFloat(v.total_hours||0).toFixed(1)}h</span>
        ${allReviewed?'<span style="font-size:10px;color:var(--green);font-family:DM Mono,monospace;border:1px solid rgba(74,192,120,.3);padding:2px 7px;border-radius:3px;">✓ DONE</span>':''}
        <span class="visit-chevron">▼</span>
      </div>
      <div class="visit-body">
        ${photos.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;">${photos.map(p=>`<img src="${p}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer;" onclick="window.open('${p}','_blank')">`).join('')}</div>`:''}
        ${v.materials_used?`<div style="font-size:12px;color:var(--blue);margin:8px 0;">📦 ${v.materials_used}</div>`:''}
        ${v.problem_notes?`<div style="font-size:12px;color:var(--amber);margin:8px 0;">⚠ ${v.problem_notes}</div>`:''}
        ${linesHtml}
        <div style="margin-top:12px;display:flex;gap:8px;">
          ${vLines.length?`<button class="btn btn-primary" onclick="markAllReviewed('${v.id}')">✓ Mark All Reviewed</button>`:''}
          <button class="btn btn-danger" onclick="deleteVisit('${v.id}')">Delete Visit</button>
        </div>
      </div>
    </div>`;
  }).join('') + '</div>';
}

function toggleCard(head) { head.parentElement.classList.toggle('open'); }

async function toggleBillable(lineId, billable) {
  await sb.from('apb_timesheet_lines').update({ billable }).eq('id', lineId);
  const l = lines.find(x=>x.id===lineId); if(l) l.billable = billable;
  showToast(billable ? 'Marked billable' : 'Marked non-billable');
}

async function toggleReviewed(lineId, reviewed, btn) {
  await sb.from('apb_timesheet_lines').update({ reviewed }).eq('id', lineId);
  const l = lines.find(x=>x.id===lineId); if(l) l.reviewed = reviewed;
  btn.className = 'reviewed-btn ' + (reviewed?'done':'pending');
  btn.textContent = reviewed?'✓ REVIEWED':'MARK DONE';
  showToast(reviewed ? 'Marked reviewed' : 'Unmarked');
  updateSummary();
}

async function markAllReviewed(visitId) {
  const ids = lines.filter(l=>l.timesheet_id===visitId).map(l=>l.id);
  await sb.from('apb_timesheet_lines').update({ reviewed: true }).in('id', ids);
  lines.filter(l=>l.timesheet_id===visitId).forEach(l=>l.reviewed=true);
  showToast('All lines marked reviewed ✓'); updateSummary(); renderVisits();
}

async function deleteVisit(visitId) {
  if (!confirm('Delete this timesheet entry?')) return;
  await sb.from('apb_timesheets').delete().eq('id', visitId);
  visits = visits.filter(v=>v.id!==visitId);
  lines = lines.filter(l=>l.timesheet_id!==visitId);
  showToast('Deleted'); updateSummary(); renderVisits();
}

function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2500); }
</script>
</body>
</html>
