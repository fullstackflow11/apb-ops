<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Review — APB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#EDEEF2; --panel:#fff; --panel-2:#F5F6FA;
    --ink:#0D1626; --ink-2:#3A4559; --ink-3:#6B7A92; --ink-4:#9BA9BE;
    --line:#DDE1E8; --line-2:#E8EBF0;
    --accent:#2457E6; --accent-soft:#EAF0FE;
    --green:#0B9E6A; --green-soft:#E4F5EE;
    --amber:#B86A00; --amber-soft:#FBF0E2;
    --red:#C43030; --red-soft:#FBEAEA;
    --mono:"DM Mono",ui-monospace,monospace;
  }
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 18px 60px}

  header.top{display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:23px;font-weight:700;letter-spacing:-.01em}
  .sub{font-size:13px;color:var(--ink-3);margin-top:3px}
  .ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  label.f{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);font-weight:600}
  input[type=date]{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink)}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;
    color:var(--ink-2);border-radius:8px;padding:8px 13px;font-size:13px;font-weight:600}
  button:hover{border-color:var(--ink-4)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.06)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
    background:#fff;border:1px solid var(--line);color:var(--ink-3)}
  .tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .tab .n{font-family:var(--mono);font-size:12px;margin-left:6px;opacity:.75}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card + .card{margin-top:14px}
  .card h2{font-size:14px;font-weight:700;padding:13px 16px;border-bottom:1px solid var(--line-2)}
  .card h2 span{font-weight:500;color:var(--ink-3);font-size:12.5px;margin-left:8px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-4);font-weight:600;padding:9px 16px;background:var(--panel-2);
    border-bottom:1px solid var(--line-2);white-space:nowrap}
  td{padding:11px 16px;border-bottom:1px solid var(--line-2);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  td.who{font-weight:600;white-space:nowrap}
  .muted{color:var(--ink-4)}

  .sev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;
    vertical-align:1px;flex:none}
  .s1{background:var(--red)} .s2{background:var(--amber)} .s3{background:var(--ink-4)}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
  .p-red{background:var(--red-soft);color:var(--red)}
  .p-amber{background:var(--amber-soft);color:var(--amber)}
  .p-green{background:var(--green-soft);color:var(--green)}
  .p-grey{background:var(--panel-2);color:var(--ink-3)}

  .delta{font-family:var(--mono);font-weight:500}
  .over{color:var(--red)} .under{color:var(--amber)}

  .empty{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:14px}
  .empty b{display:block;font-size:15px;color:var(--ink-2);margin-bottom:4px}
  .note{font-size:12.5px;color:var(--ink-3);padding:11px 16px;background:var(--panel-2);
    border-top:1px solid var(--line-2)}
  .gate{max-width:460px;margin:70px auto;background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:26px;text-align:center}
  .gate h2{font-size:17px;margin-bottom:8px;border:0;padding:0}
  .gate p{font-size:14px;color:var(--ink-3);line-height:1.5}
  .hide{display:none}
  @media (max-width:640px){
    th:nth-child(n+5),td:nth-child(n+5){display:none}
    .wrap{padding:16px 12px 50px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Attendance review</h1>
      <div class="sub" id="sub">Clock records against submitted timesheets</div>
    </div>
    <div class="ctrl">
      <label class="f" for="from">From</label>
      <input type="date" id="from">
      <label class="f" for="to">To</label>
      <input type="date" id="to">
      <button id="today">Today</button>
      <button id="week">Last 7 days</button>
      <button class="primary" id="load">Refresh</button>
    </div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab on" data-v="all">Clocked vs logged <span class="n" id="n-all"></span></button>
    <button class="tab" data-v="ex">Needs review <span class="n" id="n-ex"></span></button>
    <button class="tab" data-v="fl">Flagged punches <span class="n" id="n-fl"></span></button>
    <button class="tab" data-v="rf">Turned away <span class="n" id="n-rf"></span></button>
    <button class="tab" data-v="dv">Shared phones <span class="n" id="n-dv"></span></button>
  </div>

  <div id="gate" class="gate hide">
    <h2>Sign in first</h2>
    <p>Open the dashboard and sign in, then come back to this page. Attendance records are only readable by managers.</p>
  </div>

  <div id="panes"></div>
</div>

<script>
const SUPABASE_URL='https://aanrxyiocxxndkvkeocv.supabase.co';
const SUPABASE_KEY='sb_publishable_DzUy57K8eF8I1HeAYrCz3A_G7aEiyCw';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,
  {auth:{persistSession:true,autoRefreshToken:true}});

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const clock=t=>t?new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'—';
const day=t=>t?new Date(t).toLocaleDateString([],{month:'short',day:'numeric'}):'—';
const hrs=v=>(v==null||v==='')?'—':Number(v).toFixed(2);

let view='all', data={all:[],ex:[],fl:[],rf:[],dv:[]};

function setRange(days){
  const to=new Date(); const from=new Date();
  from.setDate(from.getDate()-days);
  $('from').value=ymd(from); $('to').value=ymd(to);
}

// ---- rendering -------------------------------------------------------------
function paint(){
  const rows=data[view]||[];
  ['all','ex','fl','rf','dv'].forEach(k=>$('n-'+k).textContent=(data[k]||[]).length||'');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===view));
  $('panes').innerHTML = rows.length ? RENDER[view](rows) : EMPTY[view];
}

const EMPTY={
  all:`<div class="card"><div class="empty"><b>No days yet</b>Nobody has clocked in during this period.</div></div>`,
  ex:`<div class="card"><div class="empty"><b>Nothing to review</b>Every clock record matches the hours submitted.</div></div>`,
  fl:`<div class="card"><div class="empty"><b>No flagged punches</b>Everyone punched from a known site with a good location fix.</div></div>`,
  rf:`<div class="card"><div class="empty"><b>Nobody turned away</b>No one was refused a punch in this period.</div></div>`,
  dv:`<div class="card"><div class="empty"><b>No shared phones</b>Every handset punched one person only.</div></div>`
};

const STATUS={
  'match':               ['p-green','Matches'],
  'submitted over clock':['p-red',  'Over the clock'],
  'submitted under clock':['p-amber','Under the clock'],
  'no punch':            ['p-red',  'No punch'],
  'no timesheet':        ['p-amber','No timesheet'],
  'open punch':          ['p-amber','Still clocked in'],
  'lunch not closed':    ['p-amber','Lunch not closed']
};

const RENDER={
  // Grouped by day, newest first — the way somebody actually reads a week.
  all(rows){
    const days={};
    rows.forEach(r=>{ (days[r.work_date]=days[r.work_date]||[]).push(r); });
    return Object.keys(days).sort().reverse().map(d=>{
      const list=days[d];
      const clocked=list.reduce((a,r)=>a+Number(r.worked_hours||0),0);
      const logged =list.reduce((a,r)=>a+Number(r.submitted_hours||0),0);
      const body=list.map(r=>{
        const v=Number(r.variance_hours||0);
        const cls=v>0.25?'over':(v<-0.25?'under':'');
        const st=STATUS[r.status]||['p-grey',r.status];
        return `<tr>
          <td class="who">${esc(r.tech_name)}</td>
          <td class="num muted">${clock(r.punch_in)}</td>
          <td class="num muted">${clock(r.punch_out)}</td>
          <td class="num">${hrs(r.lunch_hours)}</td>
          <td class="num">${hrs(r.worked_hours)}</td>
          <td class="num">${hrs(r.submitted_hours)}</td>
          <td class="num delta ${cls}">${v?(v>0?'+':'')+v.toFixed(2):'—'}</td>
          <td><span class="pill ${st[0]}">${st[1]}</span></td>
        </tr>`;}).join('');
      return `<div class="card">
        <h2>${day(d+'T12:00')}<span>${list.length} ${list.length===1?'person':'people'} ·
          ${clocked.toFixed(2)} h clocked · ${logged.toFixed(2)} h logged</span></h2>
        <table><thead><tr>
          <th>Tech</th><th>In</th><th>Out</th><th>Lunch</th>
          <th>Clocked</th><th>Logged</th><th>Difference</th><th>Status</th>
        </tr></thead><tbody>${body}</tbody></table>
      </div>`;}).join('');
  },
  ex(rows){
    const body=rows.map(r=>{
      const v=Number(r.variance_hours||0);
      const cls=v>0.25?'over':(v<-0.25?'under':'');
      const sign=v>0?'+':'';
      return `<tr>
        <td class="who"><span class="sev s${r.severity}"></span>${esc(r.tech_name)}</td>
        <td class="num muted">${day(r.work_date+'T12:00')}</td>
        <td>${esc(r.issue)}</td>
        <td class="num">${hrs(r.worked_hours)}</td>
        <td class="num">${hrs(r.submitted_hours)}</td>
        <td class="num delta ${cls}">${v?sign+v.toFixed(2):'—'}</td>
      </tr>`;}).join('');
    return `<div class="card">
      <h2>Needs review <span>clocked hours against submitted hours</span></h2>
      <table><thead><tr>
        <th>Tech</th><th>Day</th><th>What happened</th>
        <th>Clocked</th><th>Submitted</th><th>Difference</th>
      </tr></thead><tbody>${body}</tbody></table>
      <div class="note">A difference under 15 minutes is treated as a match and stays off this list.</div>
    </div>`;
  },
  fl(rows){
    const body=rows.map(r=>{
      const m={in:'Clocked in',out:'Clocked out',lunch_out:'Left for lunch',lunch_in:'Back from lunch'}[r.direction]||r.direction;
      const p=r.location_match==='exact'?'p-green':(r.location_match==='near'?'p-amber':'p-red');
      const label={exact:'At the shop',near:'Just outside',unknown:'Unknown place',no_fix:'No location'}[r.location_match]||r.location_match;
      const map=(r.lat&&r.lng)?`<a href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" rel="noopener">map</a>`:'';
      return `<tr>
        <td class="who">${esc(r.tech_name)}</td>
        <td class="num muted">${day(r.event_at)} ${clock(r.event_at)}</td>
        <td>${esc(m)}</td>
        <td><span class="pill ${p}">${label}</span></td>
        <td class="num">${r.distance_m!=null?Math.round(r.distance_m)+' m':'—'}</td>
        <td class="muted">${esc(r.flag_reason||'')} ${map}</td>
      </tr>`;}).join('');
    return `<div class="card">
      <h2>Flagged punches <span>recorded, but something was off</span></h2>
      <table><thead><tr>
        <th>Tech</th><th>When</th><th>Punch</th><th>Where</th><th>Distance</th><th>Reason</th>
      </tr></thead><tbody>${body}</tbody></table>
      <div class="note">Flagged punches still count. They are recorded with coordinates so you can check them.</div>
    </div>`;
  },
  rf(rows){
    const body=rows.map(r=>{
      const why={unknown_location:'Not at the shop',no_fix:'No location fix',
                 too_old:'Sent more than a day late',out_of_range:'Outside the boundary'}[r.reason]||r.reason;
      const map=(r.lat&&r.lng)?`<a href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" rel="noopener">map</a>`:'';
      return `<tr>
        <td class="who">${esc(r.tech_name)}</td>
        <td class="num muted">${day(r.attempted_at)} ${clock(r.attempted_at)}</td>
        <td>${esc(why)}</td>
        <td class="num">${r.distance_m!=null?Math.round(r.distance_m)+' m':'—'}</td>
        <td class="muted">${map}</td>
      </tr>`;}).join('');
    return `<div class="card">
      <h2>Turned away <span>tried to punch, nothing recorded</span></h2>
      <table><thead><tr>
        <th>Tech</th><th>When</th><th>Why</th><th>Distance</th><th></th>
      </tr></thead><tbody>${body}</tbody></table>
      <div class="note">If someone who was genuinely at the shop shows up here, the boundary is too tight — tell Christina and it gets widened.</div>
    </div>`;
  },
  dv(rows){
    const body=rows.map(r=>`<tr>
        <td class="who">${esc(r.who)}</td>
        <td class="num">${r.techs}</td>
        <td class="num muted">${day(r.last_seen)} ${clock(r.last_seen)}</td>
        <td class="num muted">${esc(String(r.device_id).slice(0,8))}</td>
      </tr>`).join('');
    return `<div class="card">
      <h2>Shared phones <span>one handset, more than one person</span></h2>
      <table><thead><tr>
        <th>Who punched from it</th><th>People</th><th>Last used</th><th>Phone</th>
      </tr></thead><tbody>${body}</tbody></table>
      <div class="note">A borrowed or replaced phone looks the same as one person punching for another. Worth asking about, not acting on alone.</div>
    </div>`;
  }
};

// ---- loading ---------------------------------------------------------------
async function load(){
  const from=$('from').value, to=$('to').value;
  if(!from||!to) return;
  $('sub').textContent='Loading…';
  const calls=[
    ['all','punch_vs_timesheet_list'],
    ['ex','punch_exceptions_list'],
    ['fl','punch_flagged_list'],
    ['rf','punch_refused_list'],
    ['dv','punch_shared_devices']
  ];
  let denied=false;
  for(const [key,fn] of calls){
    const {data:d,error}=await sb.rpc(fn,{p_from:from,p_to:to});
    if(error){
      // 42501 / permission denied means no manager session, not a broken page.
      if(String(error.message||'').match(/permission|denied|JWT/i)) denied=true;
      data[key]=[];
    } else data[key]=d||[];
  }
  if(denied){ $('gate').classList.remove('hide'); $('panes').innerHTML=''; $('sub').textContent=''; return; }
  $('gate').classList.add('hide');
  const n=data.ex.length;
  $('sub').textContent = n ? (n+' '+(n===1?'day needs':'days need')+' a look') : 'Everything matches';
  paint();
}

$('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t) return;
  view=t.dataset.v; paint();
});
$('load').addEventListener('click',load);
$('today').addEventListener('click',()=>{setRange(0);load();});
$('week').addEventListener('click',()=>{setRange(6);load();});
$('from').addEventListener('change',load);
$('to').addEventListener('change',load);

setRange(6);
load();
</script>
</body>
</html>
