<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>APB Tech Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0d0f12;
    --card: #161a20;
    --border: #252b35;
    --accent: #ff8c00;
    --blue: #2096ff;
    --green: #20c060;
    --red: #e83030;
    --text: #e8eaf0;
    --muted: #6b7485;
    --input-bg: #1a1f28;
  }
  html { height: 100%; background: var(--bg); }
  body { min-height: 100%; color: var(--text); font-family: 'DM Sans', sans-serif; max-width: 480px; margin: 0 auto; }

  /* SCREENS */
  .screen { display: none; min-height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }

  /* === LOGIN SCREEN === */
  #loginScreen {
    align-items: center; justify-content: center; padding: 32px 24px;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,140,0,.08) 0%, transparent 60%), var(--bg);
  }
  .login-logo { text-align: center; margin-bottom: 40px; }
  .login-logo .anchor { width: 4px; height: 40px; background: var(--accent); border-radius: 2px; display: inline-block; margin-bottom: 12px; }
  .login-logo h1 { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: 4px; }
  .login-logo p { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .login-card { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; }
  .login-card h2 { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
  
  /* PIN pad */
  .pin-display { display: flex; gap: 10px; justify-content: center; margin-bottom: 28px; }
  .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.15s; }
  .pin-dot.filled { background: var(--accent); border-color: var(--accent); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pin-btn {
    background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px;
    height: 64px; font-size: 22px; font-weight: 600; color: var(--text);
    cursor: pointer; transition: all 0.1s; user-select: none;
    display: flex; align-items: center; justify-content: center;
  }
  .pin-btn:active { transform: scale(0.93); background: var(--border); }
  .pin-btn.del { font-size: 18px; color: var(--muted); }
  .pin-btn.clear-btn { font-size: 13px; color: var(--muted); }
  
  .tech-selector { margin-bottom: 20px; }
  .tech-selector label { font-size: 12px; color: var(--muted); letter-spacing: 1px; display: block; margin-bottom: 8px; font-family: 'DM Mono', monospace; }
  .tech-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tech-btn {
    background: var(--input-bg); border: 2px solid var(--border); border-radius: 10px;
    padding: 12px 8px; text-align: center; font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; color: var(--text);
  }
  .tech-btn.selected { border-color: var(--accent); color: var(--accent); background: rgba(255,140,0,.08); }
  .tech-btn:active { transform: scale(0.95); }
  
  .login-error { color: var(--red); font-size: 13px; text-align: center; margin-top: 12px; min-height: 20px; }

  /* === MAIN APP SCREEN === */
  #appScreen { background: var(--bg); }
  
  .app-header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 50;
  }
  .app-header .tech-name { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; }
  .app-header .date { font-size: 12px; color: var(--muted); }
  .logout-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  .logout-btn:active { background: var(--border); }

  /* Tabs */
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--card); }
  .tab { flex: 1; padding: 14px; text-align: center; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-content { display: none; padding: 20px; flex: 1; }
  .tab-content.active { display: block; }

  /* Form */
  .form-group { margin-bottom: 18px; }
  .form-label { font-size: 12px; color: var(--muted); letter-spacing: 1px; display: block; margin-bottom: 8px; font-family: 'DM Mono', monospace; text-transform: uppercase; }
  .form-select, .form-input, .form-textarea {
    width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px;
    transition: border-color 0.15s; -webkit-appearance: none; appearance: none;
  }
  .form-select:focus, .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
  .form-textarea { min-height: 90px; resize: vertical; }
  .form-select option { background: var(--card); }
  
  .hours-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .hours-btn {
    background: var(--input-bg); border: 2px solid var(--border); border-radius: 10px;
    padding: 14px 8px; text-align: center; font-size: 15px; font-weight: 600; font-family: 'DM Mono', monospace;
    cursor: pointer; transition: all 0.15s; color: var(--text);
  }
  .hours-btn.selected { border-color: var(--accent); color: var(--accent); background: rgba(255,140,0,.08); }
  .hours-btn:active { transform: scale(0.95); }
  
  .custom-hours { margin-top: 10px; }

  .submit-btn {
    width: 100%; background: var(--accent); color: #000; border: none; border-radius: 12px;
    padding: 18px; font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px;
    transition: all 0.15s; margin-top: 8px;
  }
  .submit-btn:active { transform: scale(0.97); opacity: 0.9; }
  .submit-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  .success-msg { background: rgba(32,192,96,.12); border: 1px solid rgba(32,192,96,.3); border-radius: 10px; padding: 14px; text-align: center; color: var(--green); font-size: 14px; margin-bottom: 16px; }
  .error-msg { background: rgba(232,48,48,.12); border: 1px solid rgba(232,48,48,.3); border-radius: 10px; padding: 14px; color: var(--red); font-size: 14px; margin-bottom: 16px; }

  /* History tab */
  .history-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .history-vessel { font-weight: 600; font-size: 14px; }
  .history-hours { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; color: var(--accent); }
  .history-date { font-size: 12px; color: var(--muted); }
  .history-desc { font-size: 13px; color: var(--muted); }
  .history-total { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
  .history-total-label { font-size: 13px; color: var(--muted); }
  .history-total-val { font-family: 'DM Mono', monospace; font-size: 24px; color: var(--accent); font-weight: 500; }
  .empty-state { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 20px; }
  
  .loading { text-align: center; padding: 32px; }
  .dot-loader { display: inline-flex; gap: 6px; }
  .dot-loader span { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: bounce 0.8s infinite; }
  .dot-loader span:nth-child(2) { animation-delay: .15s; }
  .dot-loader span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="screen active">
  <div class="login-logo">
    <div class="anchor"></div>
    <h1>APB TECH</h1>
    <p>Timesheet Portal</p>
  </div>
  <div class="login-card">
    <h2>Select your name & enter PIN</h2>
    
    <div class="tech-selector">
      <label>WHO ARE YOU?</label>
      <div class="tech-grid" id="techGrid">
        <!-- populated by JS -->
      </div>
    </div>

    <div class="pin-display" id="pinDisplay">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>

    <div class="pin-pad">
      <button class="pin-btn" onclick="pinPress('1')">1</button>
      <button class="pin-btn" onclick="pinPress('2')">2</button>
      <button class="pin-btn" onclick="pinPress('3')">3</button>
      <button class="pin-btn" onclick="pinPress('4')">4</button>
      <button class="pin-btn" onclick="pinPress('5')">5</button>
      <button class="pin-btn" onclick="pinPress('6')">6</button>
      <button class="pin-btn" onclick="pinPress('7')">7</button>
      <button class="pin-btn" onclick="pinPress('8')">8</button>
      <button class="pin-btn" onclick="pinPress('9')">9</button>
      <button class="pin-btn clear-btn" onclick="pinClear()">CLR</button>
      <button class="pin-btn" onclick="pinPress('0')">0</button>
      <button class="pin-btn del" onclick="pinDel()">⌫</button>
    </div>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- APP SCREEN -->
<div id="appScreen" class="screen">
  <div class="app-header">
    <div>
      <div class="tech-name" id="headerName">Tech</div>
      <div class="date" id="headerDate"></div>
    </div>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('log')">Log Time</div>
    <div class="tab" onclick="switchTab('history')">My Hours</div>
  </div>
  
  <!-- LOG TIME TAB -->
  <div class="tab-content active" id="tabLog">
    <div id="logMsg"></div>
    
    <div class="form-group">
      <label class="form-label">Vessel / Project</label>
      <select class="form-select" id="jobVessel">
        <option value="">Select job...</option>
      </select>
    </div>

    <div class="form-group" id="jobDescGroup" style="display:none">
      <label class="form-label">Job Description</label>
      <select class="form-select" id="jobDesc">
        <option value="">Select task...</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Date</label>
      <input type="date" class="form-input" id="workDate">
    </div>

    <div class="form-group">
      <label class="form-label">Hours Worked</label>
      <div class="hours-grid">
        <button class="hours-btn" onclick="setHours(2)">2</button>
        <button class="hours-btn" onclick="setHours(4)">4</button>
        <button class="hours-btn" onclick="setHours(6)">6</button>
        <button class="hours-btn" onclick="setHours(8)">8</button>
      </div>
      <div class="custom-hours">
        <input type="number" class="form-input" id="hoursInput" placeholder="Or enter custom hours..." min="0.5" max="16" step="0.5">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">What did you work on? (optional)</label>
      <textarea class="form-textarea" id="workDesc" placeholder="Brief description of work completed..."></textarea>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitTimesheet()">LOG HOURS</button>
  </div>

  <!-- HISTORY TAB -->
  <div class="tab-content" id="tabHistory">
    <div id="historyContent">
      <div class="loading"><div class="dot-loader"><span></span><span></span><span></span></div></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://aanrxyiocxxndkvkeocv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DzUy57K8eF8I1HeAYrCz3A_G7aEiyCw';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentTech = null;
let allTechs = [];
let allJobs = [];
let selectedPin = '';
let selectedHours = null;

// Init
(async function init() {
  // Load techs
  const {data} = await sb.from('apb_techs').select('*').eq('active', true);
  allTechs = data || [];
  const grid = document.getElementById('techGrid');
  grid.innerHTML = allTechs.map(t => `
    <div class="tech-btn" onclick="selectTech('${t.id}', this)">${t.name}</div>
  `).join('');
  
  // Load jobs
  const {data: jobs} = await sb.from('APB').select('"Vessel/Project", "Job No", "Job Description", "Status"').not('Status', 'in', '("Paid","Closed","Cancelled")').order('"Vessel/Project"');
  allJobs = jobs || [];

  // Set date
  document.getElementById('workDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
  
  // Check session
  const saved = sessionStorage.getItem('apb_tech');
  if (saved) {
    currentTech = JSON.parse(saved);
    showApp();
  }
})();

function selectTech(id, el) {
  document.querySelectorAll('.tech-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  currentTech = allTechs.find(t => t.id === id);
  selectedPin = '';
  updatePinDots();
  document.getElementById('loginError').textContent = '';
}

function pinPress(d) {
  if (!currentTech) { document.getElementById('loginError').textContent = 'Select your name first.'; return; }
  if (selectedPin.length >= 4) return;
  selectedPin += d;
  updatePinDots();
  if (selectedPin.length === 4) checkPin();
}
function pinDel() { selectedPin = selectedPin.slice(0,-1); updatePinDots(); }
function pinClear() { selectedPin = ''; updatePinDots(); }
function updatePinDots() {
  document.querySelectorAll('.pin-dot').forEach((d,i) => d.classList.toggle('filled', i < selectedPin.length));
}
function checkPin() {
  if (selectedPin === currentTech.pin) {
    sessionStorage.setItem('apb_tech', JSON.stringify(currentTech));
    showApp();
  } else {
    document.getElementById('loginError').textContent = 'Incorrect PIN. Try again.';
    setTimeout(() => { selectedPin = ''; updatePinDots(); }, 800);
  }
}

function showApp() {
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('appScreen').classList.add('active');
  document.getElementById('headerName').textContent = currentTech.name + ' · ' + (currentTech.role||'Tech');
  populateJobs();
  loadHistory();
}

function logout() {
  sessionStorage.removeItem('apb_tech');
  currentTech = null; selectedPin = '';
  document.getElementById('loginScreen').classList.add('active');
  document.getElementById('appScreen').classList.remove('active');
  document.querySelectorAll('.tech-btn').forEach(b=>b.classList.remove('selected'));
  updatePinDots();
}

function populateJobs() {
  const vessels = [...new Set(allJobs.map(j=>j['Vessel/Project']))].sort();
  const sel = document.getElementById('jobVessel');
  sel.innerHTML = '<option value="">Select vessel...</option>' + vessels.map(v=>`<option value="${v}">${v}</option>`).join('');
  sel.addEventListener('change', function() {
    const v = this.value;
    const tasks = allJobs.filter(j=>j['Vessel/Project']===v);
    if (tasks.length > 1) {
      document.getElementById('jobDescGroup').style.display = 'block';
      document.getElementById('jobDesc').innerHTML = '<option value="">All work on vessel</option>' + tasks.map(t=>`<option value="${t['Job Description']||''}">${t['Job No']||''} ${t['Job Description']||''}</option>`).join('');
    } else {
      document.getElementById('jobDescGroup').style.display = 'none';
    }
  });
}

function setHours(h) {
  selectedHours = h;
  document.querySelectorAll('.hours-btn').forEach(b=>b.classList.remove('selected'));
  event.target.classList.add('selected');
  document.getElementById('hoursInput').value = h;
}

async function submitTimesheet() {
  const vessel = document.getElementById('jobVessel').value;
  const desc = document.getElementById('jobDesc').value;
  const date = document.getElementById('workDate').value;
  const hours = parseFloat(document.getElementById('hoursInput').value);
  const workDesc = document.getElementById('workDesc').value;

  if (!vessel) { showMsg('error', 'Please select a vessel/project.'); return; }
  if (!hours || hours <= 0) { showMsg('error', 'Please enter hours worked.'); return; }
  if (!date) { showMsg('error', 'Please select a date.'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Submitting...';

  // Find job for job_no
  const job = allJobs.find(j => j['Vessel/Project'] === vessel && (!desc || j['Job Description'] === desc));

  const {error} = await sb.from('apb_timesheets').insert({
    tech_id: currentTech.id,
    tech_name: currentTech.name,
    job_vessel: vessel,
    job_no: job?.['Job No'] || '',
    job_description: desc || (job?.['Job Description']||''),
    date: date,
    hours_worked: hours,
    work_description: workDesc
  });

  btn.disabled = false; btn.textContent = 'LOG HOURS';

  if (error) { showMsg('error', 'Error saving. Try again.'); console.error(error); return; }
  
  showMsg('success', `✓ ${hours} hours logged on ${vessel}`);
  document.getElementById('jobVessel').value = '';
  document.getElementById('hoursInput').value = '';
  document.getElementById('workDesc').value = '';
  document.getElementById('jobDescGroup').style.display = 'none';
  document.querySelectorAll('.hours-btn').forEach(b=>b.classList.remove('selected'));
  selectedHours = null;
  loadHistory();
}

function showMsg(type, msg) {
  const el = document.getElementById('logMsg');
  el.innerHTML = `<div class="${type}-msg">${msg}</div>`;
  setTimeout(()=>{ el.innerHTML=''; }, 4000);
}

async function loadHistory() {
  const {data} = await sb.from('apb_timesheets').select('*').eq('tech_name', currentTech.name).order('date', {ascending:false}).limit(30);
  const el = document.getElementById('historyContent');
  if (!data || !data.length) { el.innerHTML = '<div class="empty-state">No hours logged yet.<br>Start by logging time on the Log Time tab.</div>'; return; }
  
  const totalHours = data.reduce((s,t)=>s+parseFloat(t.hours_worked),0);
  // This week
  const today = new Date(); const monday = new Date(today); monday.setDate(today.getDate() - today.getDay() + 1);
  const weekHours = data.filter(t=>new Date(t.date+'T12:00:00')>=monday).reduce((s,t)=>s+parseFloat(t.hours_worked),0);

  el.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
      <div class="history-total">
        <div><div class="history-total-label">This Week</div><div class="history-total-val">${weekHours}h</div></div>
      </div>
      <div class="history-total">
        <div><div class="history-total-label">Total (30d)</div><div class="history-total-val">${totalHours}h</div></div>
      </div>
    </div>
    ${data.map(t=>`
    <div class="history-item">
      <div class="history-header">
        <div class="history-vessel">${t.job_vessel}</div>
        <div class="history-hours">${t.hours_worked}h</div>
      </div>
      ${t.job_description?`<div class="history-desc">${t.job_description}</div>`:''}
      ${t.work_description?`<div class="history-desc" style="margin-top:4px">${t.work_description}</div>`:''}
      <div class="history-date" style="margin-top:8px">${new Date(t.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div>
    </div>`).join('')}`;
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['log','history'][i]===tab));
  document.getElementById('tabLog').classList.toggle('active', tab==='log');
  document.getElementById('tabHistory').classList.toggle('active', tab==='history');
  if (tab==='history') loadHistory();
}
</script>
</body>
</html>
