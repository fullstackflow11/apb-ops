<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APB — Leads & Jobs</title>
<!-- cache-bust: v2 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #000; --card: #0c0c0e; --card2: #141417; --border: #2a2a2e; --border-bright: #3a3a40;
  --silver: #c8ccd2; --silver-bright: #e8ebef; --silver-dim: #8a8e96;
  --metal: linear-gradient(135deg, #d8dce2 0%, #9a9ea6 45%, #c0c4ca 55%, #7a7e86 100%);
  --text: #f4f5f7; --muted: #72767e; --input-bg: #111114;
  --green: #4ac078; --blue: #2a9fd8; --amber: #d8a048; --red: #d84848; --purple: #9a7ae0;
  --font-mono: 'DM Mono', monospace; --font-body: 'DM Sans', sans-serif;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); }
body { overflow-x: hidden; }
a { color: inherit; text-decoration: none; }

header { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.logo { display: flex; align-items: center; gap: 14px; }
.logo .bar { width: 5px; height: 34px; background: var(--metal); border-radius: 2px; }
.logo h1 { font-family: var(--font-mono); font-size: 20px; font-weight: 500; letter-spacing: 4px; background: var(--metal); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.logo p { font-size: 10px; color: var(--silver-dim); letter-spacing: 2px; margin-top: 2px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.btn-ghost { background: var(--input-bg); border: 1px solid var(--border-bright); color: var(--silver-dim); padding: 7px 13px; border-radius: 8px; cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; }
.btn-ghost:hover { border-color: var(--silver); color: var(--silver); }
.btn-metal { background: var(--metal); color: #000; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 1px; }

.main-tabs { display: flex; gap: 0; background: var(--card); border-bottom: 1px solid var(--border); padding: 0 28px; }
.main-tab { padding: 14px 24px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
.main-tab.active { color: var(--silver-bright); border-bottom-color: var(--silver); }

main { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }

/* TOOLBAR */
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.search-input { background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 9px 14px; font-size: 13px; font-family: var(--font-body); width: 260px; }
.search-input:focus { outline: none; border-color: var(--silver); }
.filter-select { background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 9px 12px; font-size: 13px; font-family: var(--font-body); -webkit-appearance: none; cursor: pointer; }
.filter-select:focus { outline: none; border-color: var(--silver); }
.toolbar-right { margin-left: auto; }
.count-chip { font-family: var(--font-mono); font-size: 11px; color: var(--silver-dim); background: var(--input-bg); border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; }

/* FOLDER VIEW */
.folder-group { margin-bottom: 10px; }
.folder-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; user-select: none; transition: border-color 0.15s; }
.folder-header:hover { border-color: var(--border-bright); }
.folder-header.open { border-radius: 10px 10px 0 0; border-bottom-color: var(--card2); }
.folder-icon { font-size: 18px; }
.folder-name { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--silver-bright); flex: 1; }
.folder-meta { font-size: 11px; color: var(--muted); }
.folder-badge { font-family: var(--font-mono); font-size: 10px; background: var(--input-bg); border: 1px solid var(--border); padding: 2px 8px; border-radius: 3px; color: var(--silver-dim); }
.folder-chevron { font-family: var(--font-mono); font-size: 12px; color: var(--muted); transition: transform 0.2s; }
.folder-header.open .folder-chevron { transform: rotate(90deg); }
.folder-body { background: var(--card2); border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; overflow: hidden; display: none; }
.folder-body.open { display: block; }

/* CARDS */
.card-item { display: grid; gap: 0; border-bottom: 1px solid var(--border); }
.card-item:last-child { border-bottom: none; }
.card-row { display: flex; align-items: center; gap: 12px; padding: 13px 18px; cursor: pointer; transition: background 0.1s; }
.card-row:hover { background: rgba(255,255,255,0.02); }
.card-status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.card-name { font-size: 14px; font-weight: 500; color: var(--silver-bright); flex: 1; }
.card-vessel { font-size: 12px; color: var(--muted); }
.card-badge { font-family: var(--font-mono); font-size: 10px; padding: 2px 7px; border-radius: 3px; white-space: nowrap; border: 1px solid; }
.card-date { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.card-actions { display: flex; gap: 6px; }
.icon-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--silver-dim); width: 28px; height: 28px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.icon-btn:hover { border-color: var(--silver); color: var(--silver); }
.icon-btn.danger:hover { border-color: var(--red); color: var(--red); }

/* STATUS COLORS */
.s-new { background: #555; } .s-contacted { background: #2a9fd8; } .s-proposal { background: #9a7ae0; }
.s-won { background: #4ac078; } .s-lost { background: #d84848; } .s-hold { background: #d8a048; }
.s-rfq { background: #d87a35; } .s-estimating { background: #c0c020; } .s-approved { background: #9a7ae0; }
.s-scheduled { background: #60a0ff; } .s-inprogress { background: #2a9fd8; } .s-ready { background: #d8a048; }
.s-paid { background: #4ac078; } .s-cancelled { background: #333; }

.badge-new { color: #999; border-color: #444; }
.badge-contacted { color: #2a9fd8; border-color: rgba(42,159,216,.3); background: rgba(42,159,216,.08); }
.badge-proposal { color: #9a7ae0; border-color: rgba(154,122,224,.3); background: rgba(154,122,224,.08); }
.badge-won { color: #4ac078; border-color: rgba(74,192,120,.3); background: rgba(74,192,120,.08); }
.badge-lost { color: #d84848; border-color: rgba(216,72,72,.3); background: rgba(216,72,72,.08); }
.badge-hold { color: #d8a048; border-color: rgba(216,160,72,.3); background: rgba(216,160,72,.08); }
.badge-rfq { color: #d87a35; border-color: rgba(216,122,53,.3); background: rgba(216,122,53,.08); }
.badge-estimating { color: #c8c040; border-color: rgba(200,192,64,.3); background: rgba(200,192,64,.08); }
.badge-approved { color: #9a7ae0; border-color: rgba(154,122,224,.3); background: rgba(154,122,224,.08); }
.badge-scheduled { color: #60a0ff; border-color: rgba(96,160,255,.3); background: rgba(96,160,255,.08); }
.badge-inprogress { color: #2a9fd8; border-color: rgba(42,159,216,.3); background: rgba(42,159,216,.08); }
.badge-ready { color: #d8a048; border-color: rgba(216,160,72,.3); background: rgba(216,160,72,.08); }
.badge-paid { color: #4ac078; border-color: rgba(74,192,120,.3); background: rgba(74,192,120,.08); }
.badge-cancelled { color: #555; border-color: #333; }
.badge-priority-urgent { color: #d84848; border-color: rgba(216,72,72,.4); background: rgba(216,72,72,.1); }
.badge-priority-high { color: #d8a048; border-color: rgba(216,160,72,.4); background: rgba(216,160,72,.1); }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 500; display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
.modal-overlay.open { display: flex; }
.modal { background: var(--card); border: 1px solid var(--border-bright); border-radius: 16px; width: 100%; max-width: 640px; overflow: hidden; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); }
.modal-title { font-family: var(--font-mono); font-size: 14px; letter-spacing: 2px; color: var(--silver-bright); text-transform: uppercase; }
.modal-close { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--silver-dim); width: 30px; height: 30px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { border-color: var(--silver); color: var(--silver); }
.modal-body { padding: 24px; max-height: 70vh; overflow-y: auto; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

/* FORM */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
.form-full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-family: var(--font-mono); font-size: 11px; color: var(--silver-dim); letter-spacing: 1px; text-transform: uppercase; }
.field label .req { color: var(--red); }
.form-input, .form-select, .form-textarea { background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 13px; font-family: var(--font-body); width: 100%; -webkit-appearance: none; }
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--silver); }
.form-textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
.section-divider { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; color: var(--silver-dim); text-transform: uppercase; padding: 8px 0 4px; border-bottom: 1px solid var(--border); margin-top: 6px; }

/* FILE UPLOAD */
.upload-zone { background: var(--input-bg); border: 1px dashed var(--border-bright); border-radius: 8px; padding: 18px; text-align: center; cursor: pointer; transition: border-color 0.15s; }
.upload-zone:hover, .upload-zone.drag { border-color: var(--silver); }
.upload-zone input { display: none; }
.upload-icon { font-size: 24px; margin-bottom: 6px; }
.upload-text { font-size: 12px; color: var(--silver-dim); }
.upload-text strong { color: var(--silver); }
.file-attached { display: flex; align-items: center; gap: 10px; background: rgba(74,192,120,.08); border: 1px solid rgba(74,192,120,.25); border-radius: 8px; padding: 10px 14px; margin-top: 8px; }
.file-attached .fname { font-family: var(--font-mono); font-size: 12px; color: var(--green); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-attached .fremove { background: none; border: none; color: var(--red); cursor: pointer; font-size: 16px; }
.upload-progress { height: 3px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; display: none; }
.upload-progress-bar { height: 100%; background: var(--green); border-radius: 2px; width: 0%; transition: width 0.3s; }

/* DETAIL DRAWER */
.detail-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
.detail-field { }
.detail-label { font-family: var(--font-mono); font-size: 10px; color: var(--silver-dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
.detail-value { font-size: 13px; color: var(--text); line-height: 1.5; }
.detail-value a { color: var(--blue); }
.detail-value a:hover { text-decoration: underline; }
.detail-section { font-family: var(--font-mono); font-size: 10px; color: var(--silver-dim); letter-spacing: 2px; text-transform: uppercase; padding: 10px 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 12px; margin-top: 16px; }
.proposal-link { display: flex; align-items: center; gap: 10px; background: rgba(42,159,216,.06); border: 1px solid rgba(42,159,216,.2); border-radius: 8px; padding: 12px 16px; }
.proposal-link .pname { font-family: var(--font-mono); font-size: 12px; color: var(--blue); flex: 1; }
.proposal-link a { color: var(--blue); font-size: 12px; }
.proposal-link a:hover { text-decoration: underline; }

/* EMPTY */
.empty-state { padding: 40px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7; }
.spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--silver); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 30px auto; }
@keyframes spin { to { transform: rotate(360deg); } }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

.msg { padding: 10px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
.msg.success { background: rgba(74,192,120,.1); border: 1px solid rgba(74,192,120,.3); color: var(--green); display: block; }
.msg.error { background: rgba(216,72,72,.1); border: 1px solid rgba(216,72,72,.3); color: var(--red); display: block; }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="bar"></div><div><h1>APB CRM</h1><p>LEADS · JOBS · PROPOSALS</p></div></div>
  <div class="header-right">
    <a href="apb-dashboard.html" class="btn-ghost">← Dashboard</a>
    <a href="apb-tech-portal.html" class="btn-ghost">Tech Portal</a>
  </div>
</header>

<div class="main-tabs">
  <div class="main-tab active" onclick="switchMainTab('leads', this)">Leads</div>
  <div class="main-tab" onclick="switchMainTab('jobs', this)">Jobs</div>
</div>

<main>
  <!-- LEADS TAB -->
  <div class="tab-panel active" id="panel-leads">
    <div class="toolbar">
      <input class="search-input" id="leadSearch" placeholder="Search leads..." oninput="renderLeads()">
      <select class="filter-select" id="leadStatusFilter" onchange="renderLeads()">
        <option value="">All Statuses</option>
        <option>New</option><option>Contacted</option><option>Proposal Sent</option>
        <option>Won</option><option>Lost</option><option>On Hold</option>
      </select>
      <span class="count-chip" id="leadCount">—</span>
      <div class="toolbar-right">
        <button class="btn-metal" onclick="openLeadModal()">+ Add Lead</button>
      </div>
    </div>
    <div id="leadMsg" class="msg"></div>
    <div id="leadsView"><div class="spinner"></div></div>
  </div>

  <!-- JOBS TAB -->
  <div class="tab-panel" id="panel-jobs">
    <div class="toolbar">
      <input class="search-input" id="jobSearch" placeholder="Search jobs..." oninput="renderJobs()">
      <select class="filter-select" id="jobStatusFilter" onchange="renderJobs()">
        <option value="">All Statuses</option>
        <option>RFQ Received</option><option>Estimating</option><option>Quote Sent</option>
        <option>Approved</option><option>Scheduled</option><option>In Progress</option>
        <option>On Hold</option><option>Ready To Be Billed</option><option>Invoice Sent</option>
        <option>Paid</option><option>Cancelled</option>
      </select>
      <select class="filter-select" id="jobDeptFilter" onchange="renderJobs()">
        <option value="">All Depts</option>
        <option>Fabrication</option><option>Electrical</option><option>Mechanical</option>
        <option>Rigging</option><option>Painting</option><option>Transport</option><option>Other</option>
      </select>
      <span class="count-chip" id="jobCount">—</span>
      <div class="toolbar-right">
        <button class="btn-metal" onclick="openJobModal()">+ Add Job</button>
      </div>
    </div>
    <div id="jobMsg" class="msg"></div>
    <div id="jobsView"><div class="spinner"></div></div>
  </div>
</main>

<!-- LEAD MODAL -->
<div class="modal-overlay" id="leadModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="leadModalTitle">New Lead</span>
      <button class="modal-close" onclick="closeLeadModal()">×</button>
    </div>
    <div class="modal-body">
      <div id="leadFormMsg" class="msg"></div>
      <div class="form-grid">
        <div class="field"><label>Name <span class="req">*</span></label><input class="form-input" id="lf_name" placeholder="Contact name"></div>
        <div class="field"><label>Company</label><input class="form-input" id="lf_company" placeholder="Company or owner name"></div>
        <div class="field"><label>Phone</label><input class="form-input" id="lf_contact_phone" type="tel" placeholder="+1 (954) 000-0000"></div>
        <div class="field"><label>Email</label><input class="form-input" id="lf_contact_email" type="email" placeholder="email@example.com"></div>
        <div class="field"><label>Vessel / Project</label><input class="form-input" id="lf_vessel" placeholder="Vessel name or project"></div>
        <div class="field"><label>Status</label>
          <select class="form-select" id="lf_status">
            <option>New</option><option>Contacted</option><option>Proposal Sent</option>
            <option>Won</option><option>Lost</option><option>On Hold</option>
          </select>
        </div>
        <div class="field"><label>Source</label>
          <select class="form-select" id="lf_source">
            <option value="">—</option>
            <option>Referral</option><option>Walk-in</option><option>Phone</option>
            <option>Email</option><option>Website</option><option>Marina Network</option><option>Repeat Client</option>
          </select>
        </div>
        <div class="field"><label>Assigned To</label><input class="form-input" id="lf_assigned_to" placeholder="Rep name"></div>
        <div class="field"><label>Follow-up Date</label><input class="form-input" id="lf_follow_up_date" type="date"></div>
        <div class="field form-full"><label>RFQ Notes</label><textarea class="form-textarea" id="lf_description" placeholder="What do they need? Scope, vessel details, timeline..."></textarea></div>
        <div class="field form-full"><label>Internal Notes</label><textarea class="form-textarea" id="lf_notes" placeholder="Internal notes, pricing hints, context..."></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeLeadModal()">Cancel</button>
      <button class="btn-metal" id="leadSaveBtn" onclick="saveLead()">Save Lead</button>
    </div>
  </div>
</div>

<!-- JOB MODAL -->
<div class="modal-overlay" id="jobModal">
  <div class="modal" style="max-width:700px;">
    <div class="modal-header">
      <span class="modal-title" id="jobModalTitle">New Job</span>
      <button class="modal-close" onclick="closeJobModal()">×</button>
    </div>
    <div class="modal-body">
      <div id="jobFormMsg" class="msg"></div>
      <div class="form-grid">
        <div class="section-divider">Client Info</div>
        <div class="field"><label>Client Name <span class="req">*</span></label><input class="form-input" id="jf_client_name" placeholder="Contact name"></div>
        <div class="field"><label>Company / Owner</label><input class="form-input" id="jf_company" placeholder="Company or boat owner"></div>
        <div class="field"><label>Phone</label><input class="form-input" id="jf_phone" type="tel" placeholder="+1 (954) 000-0000"></div>
        <div class="field"><label>Email</label><input class="form-input" id="jf_email" type="email" placeholder="email@example.com"></div>

        <div class="section-divider">Vessel Info</div>
        <div class="field"><label>Vessel Name</label><input class="form-input" id="jf_vessel_name" placeholder="M/V Example"></div>
        <div class="field"><label>Vessel Type</label>
          <select class="form-select" id="jf_vessel_type">
            <option value="">—</option>
            <option>Motor Yacht</option><option>Sailing Yacht</option><option>Sport Fisher</option>
            <option>Center Console</option><option>Commercial Vessel</option><option>Tug</option>
            <option>Workboat</option><option>Barge</option><option>Other</option>
          </select>
        </div>
        <div class="field"><label>Length (ft)</label><input class="form-input" id="jf_vessel_length" placeholder="e.g. 65"></div>
        <div class="field"><label>Year</label><input class="form-input" id="jf_vessel_year" placeholder="e.g. 2008"></div>
        <div class="field"><label>Make / Builder</label><input class="form-input" id="jf_vessel_make" placeholder="e.g. Viking, Bertram"></div>
        <div class="field"><label>Flag / Registry</label><input class="form-input" id="jf_vessel_flag" placeholder="e.g. USA, Cayman"></div>
        <div class="field form-full"><label>Vessel Location / Slip</label><input class="form-input" id="jf_vessel_location" placeholder="e.g. LMC Slip 42, Bahia Mar"></div>

        <div class="section-divider">Job Details</div>
        <div class="field"><label>Job No</label><input class="form-input" id="jf_job_no" placeholder="e.g. APB-2026-0142"></div>
        <div class="field"><label>Department</label>
          <select class="form-select" id="jf_department">
            <option value="">—</option>
            <option>Fabrication</option><option>Electrical</option><option>Mechanical</option>
            <option>Rigging</option><option>Painting</option><option>Transport</option><option>Other</option>
          </select>
        </div>
        <div class="field"><label>Status</label>
          <select class="form-select" id="jf_status">
            <option>RFQ Received</option><option>Estimating</option><option>Quote Sent</option>
            <option>Approved</option><option>Scheduled</option><option>In Progress</option>
            <option>On Hold</option><option>Ready To Be Billed</option><option>Invoice Sent</option>
            <option>Paid</option><option>Cancelled</option>
          </select>
        </div>
        <div class="field"><label>Priority</label>
          <select class="form-select" id="jf_priority">
            <option>Normal</option><option>Low</option><option>High</option><option>Urgent</option>
          </select>
        </div>
        <div class="field"><label>Estimated Value ($)</label><input class="form-input" id="jf_estimated_value" type="number" placeholder="0.00"></div>
        <div class="field form-full"><label>Job Description</label><input class="form-input" id="jf_job_description" placeholder="Short title for this job"></div>
        <div class="field form-full"><label>Scope of Work</label><textarea class="form-textarea" id="jf_scope_of_work" style="min-height:90px;" placeholder="Detailed scope, materials, special requirements..."></textarea></div>

        <div class="section-divider">Proposal</div>
        <div class="field form-full">
          <label>Upload Proposal (PDF)</label>
          <label class="upload-zone" id="uploadZone">
            <input type="file" accept=".pdf,.doc,.docx" id="proposalFile" onchange="handleFileSelect(this)">
            <div class="upload-icon">📄</div>
            <div class="upload-text"><strong>Click to upload</strong> or drag &amp; drop<br>PDF, DOC, DOCX</div>
          </label>
          <div class="upload-progress" id="uploadProgress"><div class="upload-progress-bar" id="uploadProgressBar"></div></div>
          <div id="fileAttached" style="display:none;"></div>
        </div>

        <div class="field form-full"><label>Notes</label><textarea class="form-textarea" id="jf_notes" placeholder="Internal notes, PO numbers, client communications..."></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeJobModal()">Cancel</button>
      <button class="btn-metal" id="jobSaveBtn" onclick="saveJob()">Save Job</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal" style="max-width:660px;">
    <div class="modal-header">
      <span class="modal-title" id="detailTitle">Detail</span>
      <button class="modal-close" onclick="closeDetail()">×</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer" id="detailFooter"></div>
  </div>
</div>

<script>
const SB_URL = 'https://aanrxyiocxxndkvkeocv.supabase.co';
const SB_KEY = 'sb_publishable_DzUy57K8eF8I1HeAYrCz3A_G7aEiyCw';

let sb, allLeads = [], allJobs = [], editingLeadId = null, editingJobId = null, pendingFile = null, pendingFileUrl = null, pendingFileName = null;

document.addEventListener('DOMContentLoaded', function() {
  sb = window.supabase.createClient(SB_URL, SB_KEY);
  loadLeads();
  loadJobs();
});

function switchMainTab(tab, el) {
  document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}

async function loadLeads() {
  const { data, error } = await sb.from('apb_leads').select('*').order('created_at', { ascending: false });
  if (error) { console.error(error); return; }
  allLeads = data || [];
  renderLeads();
}

function renderLeads() {
  const search = document.getElementById('leadSearch').value.toLowerCase();
  const statusF = document.getElementById('leadStatusFilter').value;
  let filtered = allLeads.filter(l => {
    const matchS = !statusF || l.status === statusF;
    const matchQ = !search || [l.name, l.company, l.vessel, l.contact_phone, l.description].some(v => v && v.toLowerCase().includes(search));
    return matchS && matchQ;
  });
  document.getElementById('leadCount').textContent = filtered.length + ' lead' + (filtered.length !== 1 ? 's' : '');
  if (!filtered.length) { document.getElementById('leadsView').innerHTML = '<div class="empty-state">No leads found.</div>'; return; }
  const byClient = groupBy(filtered, l => (l.company || l.name || 'Unknown').trim());
  document.getElementById('leadsView').innerHTML = Object.entries(byClient).sort((a,b) => a[0].localeCompare(b[0])).map(([client, leads]) => folderHtml('lead', client, leads, leadRowHtml)).join('');
}

function leadRowHtml(l) {
  const sc = statusClass(l.status, 'lead');
  return `<div class="card-item">
    <div class="card-row" onclick="showLeadDetail('${l.id}')">
      <div class="card-status-dot ${sc.dot}"></div>
      <div style="flex:1;">
        <div class="card-name">${esc(l.name)}</div>
        ${l.vessel ? `<div class="card-vessel">${esc(l.vessel)}</div>` : ''}
      </div>
      ${l.contact_phone ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--silver-dim);">${esc(l.contact_phone)}</div>` : ''}
      <span class="card-badge ${sc.badge}">${l.status}</span>
      <div class="card-date">${fmtDate(l.created_at)}</div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="icon-btn" onclick="openLeadModal('${l.id}')" title="Edit">✎</button>
        <button class="icon-btn danger" onclick="deleteLead('${l.id}')" title="Delete">✕</button>
      </div>
    </div>
  </div>`;
}

function openLeadModal(id) {
  editingLeadId = id || null;
  document.getElementById('leadModalTitle').textContent = id ? 'Edit Lead' : 'New Lead';
  document.getElementById('leadFormMsg').className = 'msg';
  const fields = ['name','company','phone','email','vessel','rfq_notes','status','source','assigned_to','follow_up_date','notes'];
  if (id) {
    const l = allLeads.find(x => x.id === id);
    if (l) fields.forEach(f => { const el = document.getElementById('lf_'+f); if(el) el.value = l[f] || ''; });
  } else {
    fields.forEach(f => { const el = document.getElementById('lf_'+f); if(el) el.value = f === 'status' ? 'New' : ''; });
  }
  document.getElementById('leadModal').classList.add('open');
}

function closeLeadModal() { document.getElementById('leadModal').classList.remove('open'); }

async function saveLead() {
  const name = document.getElementById('lf_name').value.trim();
  if (!name) { showMsg('leadFormMsg', 'error', 'Client name required.'); return; }
  const btn = document.getElementById('leadSaveBtn'); btn.disabled = true; btn.textContent = 'Saving...';
  const payload = {
    name: name,
    company: v('lf_company'), contact_phone: v('lf_contact_phone'), contact_email: v('lf_contact_email'), vessel: v('lf_vessel'),
    description: v('lf_description'), status: v('lf_status'), source: v('lf_source'),
    assigned_to: v('lf_assigned_to'), notes: v('lf_notes'),
    follow_up_date: v('lf_follow_up_date') || null
  };
  const { error } = editingLeadId
    ? await sb.from('apb_leads').update(payload).eq('id', editingLeadId)
    : await sb.from('apb_leads').insert(payload);
  btn.disabled = false; btn.textContent = 'Save Lead';
  if (error) { showMsg('leadFormMsg', 'error', error.message); return; }
  closeLeadModal(); await loadLeads(); showMsg('leadMsg', 'success', editingLeadId ? 'Lead updated.' : 'Lead added.');
}

async function deleteLead(id) {
  if (!confirm('Delete this lead?')) return;
  await sb.from('apb_leads').delete().eq('id', id);
  await loadLeads();
}

function showLeadDetail(id) {
  const l = allLeads.find(x => x.id === id); if (!l) return;
  document.getElementById('detailTitle').textContent = l.name;
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-row">
      <div class="detail-field"><div class="detail-label">Company</div><div class="detail-value">${esc(l.company||'—')}</div></div>
      <div class="detail-field"><div class="detail-label">Status</div><div class="detail-value"><span class="card-badge ${statusClass(l.status,'lead').badge}">${l.status}</span></div></div>
      <div class="detail-field"><div class="detail-label">Phone</div><div class="detail-value">${l.contact_phone ? `<a href="tel:${l.contact_phone}">${esc(l.contact_phone)}</a>` : '—'}</div></div>
      <div class="detail-field"><div class="detail-label">Email</div><div class="detail-value">${l.contact_email ? `<a href="mailto:${l.contact_email}">${esc(l.contact_email)}</a>` : '—'}</div></div>
      <div class="detail-field"><div class="detail-label">Vessel</div><div class="detail-value">${esc(l.vessel||'—')}</div></div>
      <div class="detail-field"><div class="detail-label">Source</div><div class="detail-value">${esc(l.source||'—')}</div></div>
      <div class="detail-field"><div class="detail-label">Assigned To</div><div class="detail-value">${esc(l.assigned_to||'—')}</div></div>
      <div class="detail-field"><div class="detail-label">Follow-up</div><div class="detail-value">${l.follow_up_date ? new Date(l.follow_up_date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'}</div></div>
    </div>
    ${l.description ? `<div class="detail-section">RFQ Notes</div><div class="detail-value" style="white-space:pre-wrap;">${esc(l.description)}</div>` : ''}
    ${l.notes ? `<div class="detail-section">Internal Notes</div><div class="detail-value" style="white-space:pre-wrap;">${esc(l.notes)}</div>` : ''}
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:20px;">Added ${fmtDate(l.created_at)}</div>`;
  document.getElementById('detailFooter').innerHTML = `
    <button class="btn-ghost" onclick="closeDetail()">Close</button>
    <button class="btn-metal" onclick="closeDetail();openLeadModal('${l.id}')">Edit Lead</button>`;
  document.getElementById('detailModal').classList.add('open');
}

async function loadJobs() {
  const { data, error } = await sb.from('apb_jobs').select('id, job_name, job_number, job_type, status, priority, start_date, completion_date, ms_list_item_id, apb_engagements(name)').order('created_at', { ascending: false });
  if (error) { console.error(error); return; }
  allJobs = data || [];
  renderJobs();
}

function renderJobs() {
  const search = document.getElementById('jobSearch').value.toLowerCase();
  const statusF = document.getElementById('jobStatusFilter').value;
  const deptF = document.getElementById('jobDeptFilter').value;
  let filtered = allJobs.filter(j => {
    const matchS = !statusF || j.status === statusF;
    const matchD = !deptF || j.department === deptF;
    const matchQ = !search || [j.client_name, j.company, j.vessel_name, j.job_number, j.job_name].some(v => v && v.toLowerCase().includes(search));
    return matchS && matchD && matchQ;
  });
  document.getElementById('jobCount').textContent = filtered.length + ' job' + (filtered.length !== 1 ? 's' : '');
  if (!filtered.length) { document.getElementById('jobsView').innerHTML = '<div class="empty-state">No jobs found. Add one above.</div>'; return; }
  const byClient = groupBy(filtered, j => (j.company || j.client_name || 'Unknown').trim());
  document.getElementById('jobsView').innerHTML = Object.entries(byClient).sort((a,b) => a[0].localeCompare(b[0])).map(([client, jobs]) => folderHtml('job', client, jobs, jobRowHtml)).join('');
}

function jobRowHtml(j) {
  const sc = statusClass(j.status, 'job');
  const pri = j.priority === 'Urgent' ? '<span class="card-badge badge-priority-urgent">URGENT</span>' : j.priority === 'High' ? '<span class="card-badge badge-priority-high">HIGH</span>' : '';
  return `<div class="card-item">
    <div class="card-row" onclick="showJobDetail('${j.id}')">
      <div class="card-status-dot ${sc.dot}"></div>
      <div style="flex:1;">
        <div class="card-name">${esc(j.job_name || j.job_name || 'Unnamed Job')}${j.ms_list_item_id ? ` <a href="https://allpointsboats1.sharepoint.com/sites/operations/Lists/Jobs/DispForm.aspx?ID=${j.ms_list_item_id}" target="_blank" onclick="event.stopPropagation()" style="font-size:10px;color:var(--muted);margin-left:6px;text-decoration:none;vertical-align:middle;" title="Open in SharePoint">↗</a>` : ''}</div>
        ${j.vessel_name ? `<div class="card-vessel">${esc(j.vessel_name)}${j.vessel_length ? ' · ' + j.vessel_length + 'ft' : ''}</div>` : ''}
      </div>
      ${j.job_number ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--silver-dim);">${esc(j.job_number)}</div>` : ''}
      ${pri}
      <span class="card-badge ${sc.badge}">${j.status}</span>
      ${j.estimated_value ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--silver-dim);">$${Number(j.estimated_value).toLocaleString()}</div>` : ''}
      <div class="card-date">${fmtDate(j.created_at)}</div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="icon-btn" onclick="openJobModal('${j.id}')" title="Edit">✎</button>
        <button class="icon-btn danger" onclick="deleteJob('${j.id}')" title="Delete">✕</button>
      </div>
    </div>
  </div>`;
}

function openJobModal(id) {
  editingJobId = id || null;
  pendingFile = null; pendingFileUrl = null; pendingFileName = null;
  document.getElementById('fileAttached').style.display = 'none';
  document.getElementById('fileAttached').innerHTML = '';
  document.getElementById('uploadProgress').style.display = 'none';
  document.getElementById('jobModalTitle').textContent = id ? 'Edit Job' : 'New Job';
  document.getElementById('jobFormMsg').className = 'msg';
  const fields = ['name','company','phone','email','vessel_name','vessel_type','vessel_length','vessel_year','vessel_make','vessel_flag','vessel_location','job_no','department','status','priority','estimated_value','job_name','scope_of_work','notes'];
  if (id) {
    const j = allJobs.find(x => x.id === id);
    if (j) fields.forEach(f => { const el = document.getElementById('jf_'+f); if(el) el.value = j[f] || ''; });
    if (j?.proposal_url) {
      pendingFileUrl = j.proposal_url;
      pendingFileName = j.proposal_filename || 'proposal.pdf';
      document.getElementById('fileAttached').style.display = 'block';
      document.getElementById('fileAttached').innerHTML = `<div class="file-attached"><span class="fname">${esc(pendingFileName)}</span><a href="${j.proposal_url}" target="_blank" style="color:var(--blue);font-size:12px;">View</a></div>`;
    }
  } else {
    fields.forEach(f => { const el = document.getElementById('jf_'+f); if(el) el.value = f === 'status' ? 'RFQ Received' : f === 'priority' ? 'Normal' : ''; });
  }
  document.getElementById('jobModal').classList.add('open');
}

function closeJobModal() { document.getElementById('jobModal').classList.remove('open'); pendingFile = null; }

function handleFileSelect(input) {
  const file = input.files[0]; if (!file) return;
  pendingFile = file;
  document.getElementById('fileAttached').style.display = 'block';
  document.getElementById('fileAttached').innerHTML = `<div class="file-attached"><span class="fname">${esc(file.name)}</span><button class="fremove" onclick="clearFile()">×</button></div>`;
}

function clearFile() {
  pendingFile = null; pendingFileUrl = null; pendingFileName = null;
  document.getElementById('fileAttached').style.display = 'none';
  document.getElementById('fileAttached').innerHTML = '';
  document.getElementById('proposalFile').value = '';
}

async function uploadProposal(clientName) {
  if (!pendingFile) return { url: pendingFileUrl, filename: pendingFileName };
  const folder = (clientName || 'general').toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
  const path = `${folder}/${Date.now()}-${pendingFile.name}`;
  document.getElementById('uploadProgress').style.display = 'block';
  const { data, error } = await sb.storage.from('proposals').upload(path, pendingFile, { upsert: true });
  document.getElementById('uploadProgress').style.display = 'none';
  if (error) { showMsg('jobFormMsg', 'error', 'Upload failed: ' + error.message); return null; }
  const { data: urlData } = sb.storage.from('proposals').getPublicUrl(path);
  return { url: urlData.publicUrl, filename: pendingFile.name };
}

async function saveJob() {
  const name = document.getElementById('jf_client_name').value.trim();
  if (!name) { showMsg('jobFormMsg', 'error', 'Client name required.'); return; }
  const btn = document.getElementById('jobSaveBtn'); btn.disabled = true; btn.textContent = 'Saving...';
  const upload = await uploadProposal(document.getElementById('jf_company').value || name);
  if (upload === null) { btn.disabled = false; btn.textContent = 'Save Job'; return; }
  const payload = {
    name: name,
    company: v('jf_company'), contact_phone: v('jf_phone'), contact_email: v('jf_email'),
    vessel_name: v('jf_vessel_name'), vessel_type: v('jf_vessel_type'),
    vessel_length: v('jf_vessel_length') || null, vessel_year: v('jf_vessel_year') || null,
    vessel_make: v('jf_vessel_make'), vessel_flag: v('jf_vessel_flag'),
    vessel_location: v('jf_vessel_location'),
    job_no: v('jf_job_no'), department: v('jf_department'), status: v('jf_status'),
    priority: v('jf_priority'),
    estimated_value: v('jf_estimated_value') ? parseFloat(v('jf_estimated_value')) : null,
    job_description: v('jf_job_description'), scope_of_work: v('jf_scope_of_work'),
    notes: v('jf_notes'),
    proposal_url: upload?.url || null, proposal_filename: upload?.filename || null
  };
  const { error } = editingJobId
    ? await sb.from('apb_jobs').update(payload).eq('id', editingJobId)
    : await sb.from('apb_jobs').insert(payload);
  btn.disabled = false; btn.textContent = 'Save Job';
  if (error) { showMsg('jobFormMsg', 'error', error.message); return; }
  closeJobModal(); await loadJobs(); showMsg('jobMsg', 'success', editingJobId ? 'Job updated.' : 'Job added.');
}

async function deleteJob(id) {
  if (!confirm('Delete this job?')) return;
  await sb.from('apb_jobs').delete().eq('id', id);
  await loadJobs();
}

function showJobDetail(id) {
  const j = allJobs.find(x => x.id === id); if (!j) return;
  document.getElementById('detailTitle').textContent = j.job_name || j.vessel_name || 'Job Detail';
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-row">
      <div class="detail-field"><div class="detail-label">Client</div><div class="detail-value">${esc(j.client_name||'—')}</div></div>
      <div class="detail-field"><div class="detail-label">Status</div><div class="detail-value"><span class="card-badge ${statusClass(j.status,'job').badge}">${j.status}</span></div></div>
      <div class="detail-field"><div class="detail-label">Vessel</div><div class="detail-value">${esc(j.vessel_name||'—')}</div></div>
      <div class="detail-field"><div class="detail-label">Type / Length</div><div class="detail-value">${[j.vessel_type, j.vessel_length ? j.vessel_length+'ft' : ''].filter(Boolean).join(' · ')||'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Job No</div><div class="detail-value">${esc(j.job_number||'—')}</div></div>
      <div class="detail-field"><div class="detail-label">Department</div><div class="detail-value">${esc(j.department||'—')}</div></div>
      <div class="detail-field"><div class="detail-label">Value</div><div class="detail-value">${j.estimated_value ? '$'+Number(j.estimated_value).toLocaleString() : '—'}</div></div>
      <div class="detail-field"><div class="detail-label">Priority</div><div class="detail-value">${esc(j.priority||'Normal')}</div></div>
    </div>
    ${j.scope_of_work ? `<div class="detail-section">Scope of Work</div><div class="detail-value" style="white-space:pre-wrap;">${esc(j.scope_of_work)}</div>` : ''}
    ${j.notes ? `<div class="detail-section">Notes</div><div class="detail-value" style="white-space:pre-wrap;">${esc(j.notes)}</div>` : ''}
    ${j.proposal_url ? `<div class="detail-section">Proposal</div><div class="proposal-link"><span class="pname">${esc(j.proposal_filename||'Proposal')}</span><a href="${j.proposal_url}" target="_blank">View PDF</a></div>` : ''}
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:20px;">Created ${fmtDate(j.created_at)}</div>`;
  document.getElementById('detailFooter').innerHTML = `
    <button class="btn-ghost" onclick="closeDetail()">Close</button>
    <button class="btn-metal" onclick="closeDetail();openJobModal('${j.id}')">Edit Job</button>`;
  document.getElementById('detailModal').classList.add('open');
}

function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }

function folderHtml(type, client, items, rowFn) {
  const id = 'folder-' + type + '-' + client.replace(/[^a-z0-9]/gi,'_');
  return `<div class="folder-group">
    <div class="folder-header open" onclick="toggleFolder('${id}')">
      <span class="folder-icon">📁</span>
      <span class="folder-name">${esc(client)}</span>
      <span class="folder-badge">${items.length}</span>
      <span class="folder-chevron">▶</span>
    </div>
    <div class="folder-body open" id="${id}">${items.map(rowFn).join('')}</div>
  </div>`;
}

function toggleFolder(id) {
  const body = document.getElementById(id);
  const header = body?.previousElementSibling;
  if (!body) return;
  const isOpen = body.classList.toggle('open');
  header?.classList.toggle('open', isOpen);
}

function groupBy(arr, fn) {
  return arr.reduce((acc, item) => {
    const key = fn(item);
    (acc[key] = acc[key] || []).push(item);
    return acc;
  }, {});
}

function statusClass(status, type) {
  const map = {
    'New': {dot:'s-new', badge:'badge-new'},
    'Contacted': {dot:'s-contacted', badge:'badge-contacted'},
    'Proposal Sent': {dot:'s-proposal', badge:'badge-proposal'},
    'Won': {dot:'s-won', badge:'badge-won'},
    'Lost': {dot:'s-lost', badge:'badge-lost'},
    'On Hold': {dot:'s-hold', badge:'badge-hold'},
    'RFQ Received': {dot:'s-rfq', badge:'badge-rfq'},
    'Estimating': {dot:'s-estimating', badge:'badge-estimating'},
    'Quote Sent': {dot:'s-proposal', badge:'badge-proposal'},
    'Approved': {dot:'s-approved', badge:'badge-approved'},
    'Scheduled': {dot:'s-scheduled', badge:'badge-scheduled'},
    'In Progress': {dot:'s-inprogress', badge:'badge-inprogress'},
    'Ready To Be Billed': {dot:'s-ready', badge:'badge-ready'},
    'Invoice Sent': {dot:'s-proposal', badge:'badge-proposal'},
    'Paid': {dot:'s-paid', badge:'badge-paid'},
    'Cancelled': {dot:'s-cancelled', badge:'badge-cancelled'},
  };
  return map[status] || {dot:'s-new', badge:'badge-new'};
}

function v(id) { const el = document.getElementById(id); return el ? el.value.trim() || null : null; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) { if (!d) return ''; try { return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); } catch(e) { return ''; } }
function showMsg(id, type, text) { const el = document.getElementById(id); el.textContent = text; el.className = 'msg ' + type; if (type === 'success') setTimeout(() => el.className = 'msg', 5000); }
</script>
</body>
