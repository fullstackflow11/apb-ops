<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APB — Jobs & Leads CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EDEEF2; --panel:#fff; --panel-2:#F5F6FA;
  --ink:#0D1626; --ink-2:#3A4559; --ink-3:#6B7A92; --ink-4:#9BA9BE;
  --line:#DDE1E8; --line-2:#E8EBF0;
  --accent:#2457E6; --accent-2:#1B45B8; --accent-soft:#EAF0FE;
  --green:#0B9E6A; --green-soft:#E4F5EE;
  --amber:#B86A00; --amber-soft:#FBF0E2;
  --red:#C43030; --red-soft:#FBEAEA;
  --violet:#6B3FD4; --violet-soft:#EEE9FC;
  --cyan:#0A7FA8; --cyan-soft:#E2F4FA;
  --slate:#4A5568; --slate-soft:#EDF0F4;
  --shadow-sm:0 1px 3px rgba(13,22,38,.07); --shadow:0 8px 28px -12px rgba(13,22,38,.14);
  --mono:"DM Mono",ui-monospace,monospace;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}

/* ── Header ── */
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;height:62px}
.brand{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--ink);text-transform:uppercase}
.brand-sub{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3);margin-top:1px}
.hdr-sep{width:1px;height:28px;background:var(--line)}
.spacer{flex:1}
.btn{padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn-ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-2)}

/* ── Tabs ── */
.tabs{display:flex;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);position:sticky;top:62px;z-index:99;padding:0 24px}
.tab-btn{padding:13px 20px;font-size:14px;font-weight:600;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;display:flex;align-items:center;gap:8px}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--accent)}
.tab-count{font-size:11px;font-weight:700;background:var(--panel-2);padding:2px 8px;border-radius:99px;color:var(--ink-3)}
.tab-btn.active .tab-count{background:var(--accent-soft);color:var(--accent-2)}

/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 24px;flex-wrap:wrap}
.search-input{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 14px;font:inherit;font-size:13.5px;width:240px}
.search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ── Kanban board ── */
.board{display:flex;gap:14px;padding:0 24px 40px;overflow-x:auto;align-items:flex-start;min-height:calc(100vh - 200px)}
.board::-webkit-scrollbar{height:6px}.board::-webkit-scrollbar-track{background:transparent}.board::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

.column{flex:0 0 272px;display:flex;flex-direction:column;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.col-header{padding:13px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);position:sticky;top:0}
.col-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.col-title{font-size:12.5px;font-weight:700;color:var(--ink);flex:1}
.col-count{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--panel);border:1px solid var(--line);padding:2px 8px;border-radius:99px;color:var(--ink-3)}
.col-cards{padding:10px 8px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.col-cards.drag-over{background:var(--accent-soft);border-radius:8px}

/* ── Kanban card ── */
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:.12s;position:relative;box-shadow:var(--shadow-sm)}
.kcard:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.kcard.dragging{opacity:.4;transform:scale(.98)}
.kcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.kcard-name{font-size:13px;font-weight:700;color:var(--ink);line-height:1.3;flex:1}
.kcard-actions{display:none;gap:4px;flex-shrink:0}
.kcard:hover .kcard-actions{display:flex}
.kcard-action{background:none;border:none;cursor:pointer;font-size:13px;padding:2px 4px;color:var(--ink-3);border-radius:4px}
.kcard-action:hover{background:var(--panel-2);color:var(--ink)}
.kcard-action.danger:hover{background:var(--red-soft);color:var(--red)}
.kcard-meta{font-size:11.5px;color:var(--ink-3);margin-bottom:4px;display:flex;align-items:center;gap:5px}
.kcard-vessel{font-size:12px;color:var(--ink-2);font-weight:500;margin-bottom:6px}
.kcard-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2)}
.kcard-date{font-size:11px;color:var(--ink-4)}
.kcard-value{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--green)}
.kcard-jobno{font-family:var(--mono);font-size:10px;color:var(--ink-4);background:var(--panel-2);padding:2px 6px;border-radius:4px}
.kcard-sp{font-size:10px;color:var(--accent);text-decoration:none;padding:2px 6px;border:1px solid rgba(36,87,230,.2);border-radius:4px}
.kcard-sp:hover{background:var(--accent-soft)}
.add-card-btn{margin:0 8px 8px;padding:9px;border:1.5px dashed var(--line);background:transparent;color:var(--ink-4);border-radius:8px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:.12s;width:calc(100% - 16px)}
.add-card-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ── Status colors ── */
.dot-new{background:#94A3B8}.dot-contacted{background:#2a9fd8}.dot-proposal{background:#8B5CF6}
.dot-won{background:#0B9E6A}.dot-lost{background:#C43030}.dot-hold{background:#B86A00}
.dot-rfq{background:#EA7A35}.dot-estimating{background:#C0A020}.dot-approved{background:#8B5CF6}
.dot-scheduled{background:#3B82F6}.dot-inprogress{background:#2a9fd8}.dot-ready{background:#B86A00}
.dot-invoiced{background:#7C3AED}.dot-paid{background:#0B9E6A}.dot-cancelled{background:#6B7280}

/* ── Empty column ── */
.col-empty{padding:20px 8px;text-align:center;color:var(--ink-4);font-size:12.5px}

/* ── Modals ── */
.modal-scrim{position:fixed;inset:0;background:rgba(13,22,38,.45);backdrop-filter:blur(3px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-scrim.open{display:flex}
.modal{background:var(--panel);border-radius:16px;box-shadow:0 30px 70px -20px rgba(13,22,38,.4);width:560px;max-width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
.modal-wide{width:680px}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:700;color:var(--ink)}
.modal-close{background:none;border:none;font-size:22px;color:var(--ink-4);cursor:pointer;line-height:1;padding:0 2px}
.modal-close:hover{color:var(--ink)}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal-footer .spacer{flex:1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.form-input,.form-select,.form-textarea{width:100%;background:var(--panel-2);border:1.5px solid var(--line);border-radius:8px;color:var(--ink);padding:10px 12px;font:inherit;font-size:13.5px;-webkit-appearance:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.form-textarea{resize:vertical;min-height:80px;line-height:1.5}
.section-divider{grid-column:1/-1;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;padding:10px 0 4px;border-bottom:1px solid var(--line);margin-top:8px}
.msg{display:none;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:10px}
.msg.error{display:block;background:var(--red-soft);border:1px solid rgba(196,48,48,.2);color:var(--red)}
.msg.success{display:block;background:var(--green-soft);border:1px solid rgba(11,158,106,.2);color:var(--green)}
.btn-cancel{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-3)}.btn-cancel:hover{border-color:var(--ink-3);color:var(--ink)}
.btn-save{background:var(--accent);color:#fff}.btn-save:hover{background:var(--accent-2)}
.btn-danger{background:var(--red-soft);color:var(--red);border:1px solid rgba(196,48,48,.2)}.btn-danger:hover{background:rgba(196,48,48,.15)}

/* ── Detail modal ── */
.detail-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.detail-field{display:flex;flex-direction:column;gap:4px}
.detail-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.detail-value{font-size:13.5px;color:var(--ink-2);line-height:1.4}
.detail-section{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.status-badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.badge-new{background:var(--slate-soft);color:var(--slate)}.badge-contacted{background:var(--cyan-soft);color:var(--cyan)}
.badge-proposal{background:var(--violet-soft);color:var(--violet)}.badge-won{background:var(--green-soft);color:var(--green)}
.badge-lost{background:var(--red-soft);color:var(--red)}.badge-hold{background:var(--amber-soft);color:var(--amber)}
.badge-approved{background:var(--violet-soft);color:var(--violet)}.badge-scheduled{background:var(--accent-soft);color:var(--accent)}
.badge-inprogress{background:var(--cyan-soft);color:var(--cyan)}.badge-ready{background:var(--amber-soft);color:var(--amber)}
.badge-invoiced{background:var(--violet-soft);color:var(--violet)}.badge-paid{background:var(--green-soft);color:var(--green)}
.badge-cancelled{background:var(--slate-soft);color:var(--slate)}
.proposal-link{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:6px}
.proposal-link a{color:var(--accent);font-size:13px;font-weight:600;text-decoration:none}

/* ── File upload ── */
.upload-zone{border:2px dashed var(--line);border-radius:8px;padding:16px;text-align:center;font-size:13px;color:var(--ink-3);cursor:pointer;transition:.12s}
.upload-zone:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.file-attached{display:flex;align-items:center;gap:10px;background:var(--green-soft);border:1px solid rgba(11,158,106,.2);border-radius:8px;padding:8px 12px;margin-top:8px}
.file-name{flex:1;font-size:13px;color:var(--green);font-weight:600}
.file-remove{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:0 2px}
.upload-progress{font-size:12px;color:var(--accent);margin-top:8px;display:none}

/* ── Toast ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px);opacity:0;background:#11151C;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);transition:.22s;z-index:9999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.spinner{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Header -->
<header>
  <div>
    <div class="brand">APB · CRM</div>
    <div class="brand-sub">Leads · Jobs · Pipeline</div>
  </div>
  <div class="hdr-sep"></div>
  <a href="index.html" class="btn btn-ghost">← Hub</a>
  <div class="spacer"></div>
  <button class="btn btn-primary" id="addBtn" onclick="openAddModal()">+ Add</button>
</header>

<!-- Tabs -->
<div class="tabs">
  <div class="tab-btn active" id="tabLeads" onclick="switchTab('leads')">Leads <span class="tab-count" id="leadTabCount">—</span></div>
  <div class="tab-btn" id="tabJobs" onclick="switchTab('jobs')">Jobs <span class="tab-count" id="jobTabCount">—</span></div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <input class="search-input" id="searchInput" placeholder="Search..." oninput="renderBoard()">
</div>

<!-- Board -->
<div class="board" id="board"></div>

<!-- Lead Modal -->
<div class="modal-scrim" id="leadModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="leadModalTitle">New Lead</div>
      <button class="modal-close" onclick="closeLeadModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field form-full"><label>Client / Company Name *</label><input class="form-input" id="lf_name" placeholder="Name or company"></div>
        <div class="field"><label>Vessel</label><input class="form-input" id="lf_vessel" placeholder="Vessel name"></div>
        <div class="field"><label>Status</label>
          <select class="form-select" id="lf_status">
            <option>Lead</option><option>Estimating</option><option>Proposal Created</option><option>Proposal Sent</option><option>Approved</option>
          </select>
        </div>
        <div class="field"><label>Phone</label><input class="form-input" id="lf_phone" type="tel" placeholder="Phone"></div>
        <div class="field"><label>Email</label><input class="form-input" id="lf_email" type="email" placeholder="Email"></div>
        <div class="field"><label>Source</label>
          <select class="form-select" id="lf_source">
            <option value="">Select...</option><option>Referral</option><option>Walk-in</option><option>Social Media</option><option>Website</option><option>Repeat Client</option><option>Broker</option><option>Other</option>
          </select>
        </div>
        <div class="field"><label>Assigned To</label><input class="form-input" id="lf_assigned_to" placeholder="Team member"></div>
        <div class="field"><label>Follow-up Date</label><input class="form-input" id="lf_follow_up_date" type="date"></div>
        <div class="field form-full"><label>RFQ Notes</label><textarea class="form-textarea" id="lf_description" placeholder="What is the client looking for?"></textarea></div>
        <div class="field form-full"><label>Internal Notes</label><textarea class="form-textarea" id="lf_notes" placeholder="Team notes..."></textarea></div>
      </div>
      <div class="msg" id="leadFormMsg"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeLeadModal()">Cancel</button>
      <div class="spacer"></div>
      <button class="btn btn-save" id="leadSaveBtn" onclick="saveLead()">Save Lead</button>
    </div>
  </div>
</div>

<!-- Job Modal -->
<div class="modal-scrim" id="jobModal">
  <div class="modal modal-wide">
    <div class="modal-header">
      <div class="modal-title" id="jobModalTitle">New Job</div>
      <button class="modal-close" onclick="closeJobModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="section-divider">Job Info</div>
        <div class="field form-full"><label>Job Name *</label><input class="form-input" id="jf_job_name" placeholder="Brief job title"></div>
        <div class="field"><label>Status</label>
          <select class="form-select" id="jf_status">
            <option>Lead</option><option>Estimating</option><option>Approved</option><option>In Progress</option><option>Ready To Be Billed</option><option>Invoice In Review</option><option>Invoice Sent</option><option>Paid</option><option>Canceled</option>
          </select>
        </div>
        <div class="field"><label>Job Number</label><input class="form-input" id="jf_job_number" placeholder="e.g. 1.0"></div>
        <div class="field"><label>Estimated Value</label><input class="form-input" id="jf_estimated_value" type="number" placeholder="$0"></div>
        <div class="field"><label>Department</label>
          <select class="form-select" id="jf_department">
            <option value="">Select...</option><option>Mechanical</option><option>Electrical</option><option>Fabrication</option><option>Fiberglass</option><option>Paint</option><option>Carpentry</option><option>R&D</option><option>General</option>
          </select>
        </div>

        <div class="section-divider">Vessel</div>
        <div class="field"><label>Vessel Name</label><input class="form-input" id="jf_vessel_name" placeholder="Vessel name"></div>
        <div class="field"><label>Vessel Type</label><input class="form-input" id="jf_vessel_type" placeholder="e.g. Motor Yacht"></div>
        <div class="field"><label>Length (ft)</label><input class="form-input" id="jf_vessel_length" type="number" placeholder="0"></div>
        <div class="field"><label>Year</label><input class="form-input" id="jf_vessel_year" type="number" placeholder="YYYY"></div>
        <div class="field"><label>Make / Brand</label><input class="form-input" id="jf_vessel_make" placeholder="e.g. Azimut"></div>
        <div class="field"><label>Flag</label><input class="form-input" id="jf_vessel_flag" placeholder="Country"></div>

        <div class="section-divider">Scope & Notes</div>
        <div class="field form-full"><label>Scope of Work</label><textarea class="form-textarea" id="jf_scope_of_work" rows="3" placeholder="Describe the work to be done..."></textarea></div>
        <div class="field form-full"><label>Internal Notes</label><textarea class="form-textarea" id="jf_notes" placeholder="Team notes..."></textarea></div>

        <div class="section-divider">Proposal</div>
        <div class="field form-full">
          <label>Upload Proposal (PDF)</label>
          <label class="upload-zone"><input type="file" accept=".pdf" style="display:none" id="proposalFile" onchange="handleFileSelect(this)">📄 Click to attach PDF</label>
          <div id="fileAttached" style="display:none"></div>
          <div id="uploadProgress" class="upload-progress">Uploading...</div>
        </div>
      </div>
      <div class="msg" id="jobFormMsg"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeJobModal()">Cancel</button>
      <div class="spacer"></div>
      <button class="btn btn-save" id="jobSaveBtn" onclick="saveJob()">Save Job</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-scrim" id="detailModal">
  <div class="modal modal-wide">
    <div class="modal-header">
      <div class="modal-title" id="detailTitle">Detail</div>
      <button class="modal-close" onclick="closeDetail()">×</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer" id="detailFooter"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

let currentTab='jobs';
let allLeads=[],allJobs=[];
let editingLeadId=null,editingJobId=null;
let pendingFile=null,pendingFileUrl=null,pendingFileName=null;

async function loadLeads(){
  const{data,error}=await sb.from('apb_leads').select('*').order('created_at',{ascending:false});
  if(error){console.error(error);return;}
  allLeads=data||[];
  document.getElementById('leadTabCount').textContent=allLeads.length;
  if(currentTab==='leads') renderBoard();
}
async function loadJobs(){
  const{data,error}=await sb.from('apb_jobs').select('id,job_name,job_number,job_type,status,ms_list_item_id,pm_notes,admin_notes,rd_flag,created_at,proposal_url,proposal_filename,estimated_value,department,vessel_name,vessel_type,vessel_length,vessel_year,vessel_make,vessel_flag,qbo_synced,apb_engagements(name,location,rep,status)').order('created_at',{ascending:false});
  if(error){console.error(error);return;}
  allJobs=data||[];
  document.getElementById('jobTabCount').textContent=allJobs.length;
  if(currentTab==='jobs') renderBoard();
}

// ── Tabs ──
function switchTab(tab){
  currentTab=tab;
  document.getElementById('tabLeads').classList.toggle('active',tab==='leads');
  document.getElementById('tabJobs').classList.toggle('active',tab==='jobs');
  document.getElementById('searchInput').value='';
  renderBoard();
}

// ── Board columns ──
const LEAD_COLS=[
  {key:'Lead',            label:'Lead',            color:'#94A3B8', dot:'dot-new'},
  {key:'Estimating',      label:'Estimating',      color:'#C0A020', dot:'dot-estimating'},
  {key:'Proposal Created',label:'Proposal Created',color:'#8B5CF6', dot:'dot-proposal'},
  {key:'Proposal Sent',   label:'Proposal Sent',   color:'#8B5CF6', dot:'dot-proposal'},
  {key:'Approved',        label:'Approved',        color:'#0B9E6A', dot:'dot-approved'},
];
const JOB_COLS=[
  {key:'Lead',              label:'Lead',              color:'#94A3B8', dot:'dot-new'},
  {key:'Estimating',        label:'Estimating',        color:'#C0A020', dot:'dot-estimating'},
  {key:'Approved',          label:'Approved',          color:'#8B5CF6', dot:'dot-approved'},
  {key:'In Progress',       label:'In Progress',       color:'#2a9fd8', dot:'dot-inprogress'},
  {key:'Ready To Be Billed',label:'Ready To Be Billed',color:'#B86A00', dot:'dot-ready'},
  {key:'Invoice In Review', label:'Invoice In Review', color:'#B86A00', dot:'dot-ready'},
  {key:'Invoice Sent',      label:'Invoice Sent',      color:'#7C3AED', dot:'dot-invoiced'},
  {key:'Paid',              label:'Paid',              color:'#0B9E6A', dot:'dot-paid'},
  {key:'Canceled',          label:'Canceled',          color:'#6B7280', dot:'dot-cancelled'},
];

// ── Render board ──
function renderBoard(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const board=document.getElementById('board');
  const cols=currentTab==='leads'?LEAD_COLS:JOB_COLS;
  const items=currentTab==='leads'?allLeads:allJobs;

  const filtered=items.filter(it=>{
    if(!q)return true;
    const fields=currentTab==='leads'
      ?[it.name,it.company,it.vessel,it.contact_phone,it.description]
      :[it.job_name,it.vessel_name,it.job_number,(it.apb_engagements?.name)];
    return fields.some(f=>f&&f.toLowerCase().includes(q));
  });

  board.innerHTML=cols.map(col=>{
    const colItems=filtered.filter(it=>it.status===col.key);
    return`<div class="column" data-col="${esc(col.key)}" id="col-${esc(col.key.replace(/\s/g,'-'))}">
      <div class="col-header" style="border-top:3px solid ${col.color}">
        <div class="col-dot ${col.dot}"></div>
        <div class="col-title">${col.label}</div>
        <div class="col-count">${colItems.length}</div>
      </div>
      <div class="col-cards" id="cards-${esc(col.key.replace(/\s/g,'-'))}"
        ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'${esc(col.key)}')">
        ${colItems.length?colItems.map(it=>currentTab==='leads'?leadCard(it):jobCard(it)).join(''):'<div class="col-empty">No items</div>'}
      </div>
      <button class="add-card-btn" onclick="openAddModal('${esc(col.key)}')">+ Add</button>
    </div>`;
  }).join('');
}

// ── Lead card ──
function leadCard(l){
  return`<div class="kcard" draggable="true"
    ondragstart="onDragStart(event,'${l.id}')"
    ondragend="onDragEnd(event)"
    onclick="showLeadDetail('${l.id}')">
    <div class="kcard-top">
      <div class="kcard-name">${esc(l.name||l.company||'—')}</div>
      <div class="kcard-actions" onclick="event.stopPropagation()">
        <button class="kcard-action" onclick="openLeadModal('${l.id}')" title="Edit">✎</button>
        <button class="kcard-action danger" onclick="deleteLead('${l.id}')" title="Delete">✕</button>
      </div>
    </div>
    ${l.vessel?`<div class="kcard-vessel">⚓ ${esc(l.vessel)}</div>`:''}
    ${l.contact_phone?`<div class="kcard-meta">📞 <a href="tel:${esc(l.contact_phone)}" onclick="event.stopPropagation()" style="color:var(--ink-3);text-decoration:none">${esc(l.contact_phone)}</a></div>`:''}
    ${l.assigned_to?`<div class="kcard-meta">👤 ${esc(l.assigned_to)}</div>`:''}
    <div class="kcard-footer">
      <div class="kcard-date">${fmtDate(l.created_at)}</div>
      ${l.follow_up_date?`<div style="font-size:11px;color:var(--amber)">⏰ ${fmtDate(l.follow_up_date)}</div>`:''}
    </div>
  </div>`;
}

// ── Job card ──
function jobCard(j){
  const engName=j.apb_engagements?.name||'';
  const vesselName=j.apb_engagements?.vessel_name||j.vessel_name||'';
  const vesselLength=j.apb_engagements?.vessel_length||j.vessel_length||'';
  const spLink=engName?spFolderUrl(engName):'';
  return`<div class="kcard" draggable="true"
    ondragstart="onDragStart(event,'${j.id}')"
    ondragend="onDragEnd(event)"
    onclick="showJobDetail('${j.id}')">
    <div class="kcard-top">
      <div class="kcard-name">${esc(j.job_name||'Unnamed Job')}</div>
      <div class="kcard-actions" onclick="event.stopPropagation()">
        <button class="kcard-action" onclick="openJobModal('${j.id}')" title="Edit">✎</button>
        <button class="kcard-action danger" onclick="deleteJob('${j.id}')" title="Delete">✕</button>
      </div>
    </div>
    ${!j.qbo_synced?`<div class="kcard-meta" style="font-size:11px;color:var(--amber);font-weight:600">⚠ Needs QuickBooks entry</div>`:''}
    ${vesselName?`<div class="kcard-vessel">⚓ ${esc(vesselName)}${vesselLength?' · '+vesselLength+'ft':''}</div>`:''}
    ${j.job_number?`<div class="kcard-meta"><span class="kcard-jobno">${esc(j.job_number)}</span></div>`:''}
    ${j.job_type?`<div class="kcard-meta" style="font-size:11px;color:var(--ink-4)">${esc(j.job_type)}</div>`:''}
    <div class="kcard-footer">
      <div class="kcard-date">${fmtDate(j.created_at)}</div>
      <div style="display:flex;align-items:center;gap:6px">
        ${j.estimated_value?`<div class="kcard-value">$${Number(j.estimated_value).toLocaleString()}</div>`:''}
        ${spLink?`<a class="kcard-sp" href="${spLink}" target="_blank" onclick="event.stopPropagation()">SP↗</a>`:''}
      </div>
    </div>
  </div>`;
}

// ── Drag & drop ──
let dragId=null;
function onDragStart(e,id){dragId=id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function onDragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.col-cards').forEach(c=>c.classList.remove('drag-over'));}
function onDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function onDragLeave(e){e.currentTarget.classList.remove('drag-over');}
async function onDrop(e,newStatus){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(!dragId)return;
  const table=currentTab==='leads'?'apb_leads':'apb_jobs';
  const{error}=await sb.from(table).update({status:newStatus}).eq('id',dragId);
  if(error){showToast('Error updating status');return;}
  if(currentTab==='leads'){const l=allLeads.find(x=>x.id===dragId);if(l)l.status=newStatus;}
  else{const j=allJobs.find(x=>x.id===dragId);if(j)j.status=newStatus;}
  renderBoard();
  showToast('Moved to '+newStatus+' ✓');
}

// ── Add modal ──
function openAddModal(preStatus){
  if(currentTab==='leads') openLeadModal(null,preStatus);
  else openJobModal(null,preStatus);
}

// ── Lead CRUD ──
function openLeadModal(id,preStatus){
  editingLeadId=id||null;
  document.getElementById('leadModalTitle').textContent=id?'Edit Lead':'New Lead';
  document.getElementById('leadFormMsg').className='msg';
  const fields=['name','vessel','phone','email','source','assigned_to','follow_up_date','description','notes'];
  if(id){
    const l=allLeads.find(x=>x.id===id);
    if(l){
      fields.forEach(f=>{const el=document.getElementById('lf_'+f);if(el)el.value=l[f]||'';});
      document.getElementById('lf_status').value=l.status||'New';
    }
  } else {
    fields.forEach(f=>{const el=document.getElementById('lf_'+f);if(el)el.value='';});
    document.getElementById('lf_status').value=preStatus||'New';
  }
  document.getElementById('leadModal').classList.add('open');
}
function closeLeadModal(){document.getElementById('leadModal').classList.remove('open');}
async function saveLead(){
  const name=document.getElementById('lf_name').value.trim();
  if(!name){showMsg('leadFormMsg','error','Client name required.');return;}
  const btn=document.getElementById('leadSaveBtn');btn.disabled=true;btn.textContent='Saving…';
  const payload={
    name,company:v('lf_name'),contact_phone:v('lf_phone'),contact_email:v('lf_email'),
    vessel:v('lf_vessel'),description:v('lf_description'),status:v('lf_status')||'New',
    source:v('lf_source'),assigned_to:v('lf_assigned_to'),notes:v('lf_notes'),
    follow_up_date:v('lf_follow_up_date')||null
  };
  const{error}=editingLeadId?await sb.from('apb_leads').update(payload).eq('id',editingLeadId):await sb.from('apb_leads').insert(payload);
  btn.disabled=false;btn.textContent='Save Lead';
  if(error){showMsg('leadFormMsg','error',error.message);return;}
  closeLeadModal();await loadLeads();showToast(editingLeadId?'Lead updated ✓':'Lead added ✓');
}
async function deleteLead(id){
  if(!confirm('Delete this lead?'))return;
  await sb.from('apb_leads').delete().eq('id',id);
  await loadLeads();showToast('Lead deleted');
}
function showLeadDetail(id){
  const l=allLeads.find(x=>x.id===id);if(!l)return;
  document.getElementById('detailTitle').textContent=l.name||l.company||'Lead';
  document.getElementById('detailBody').innerHTML=`
    <div class="detail-row">
      <div class="detail-field"><div class="detail-label">Status</div><div class="detail-value"><span class="status-badge badge-${(l.status||'').toLowerCase().replace(/\s+/g,'')}">${l.status||'—'}</span></div></div>
      <div class="detail-field"><div class="detail-label">Source</div><div class="detail-value">${esc(l.source||'—')}</div></div>
      <div class="detail-field"><div class="detail-label">Vessel</div><div class="detail-value">${esc(l.vessel||'—')}</div></div>
      <div class="detail-field"><div class="detail-label">Phone</div><div class="detail-value">${l.contact_phone?`<a href="tel:${l.contact_phone}" style="color:var(--accent)">${esc(l.contact_phone)}</a>`:'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Email</div><div class="detail-value">${l.contact_email?`<a href="mailto:${l.contact_email}" style="color:var(--accent)">${esc(l.contact_email)}</a>`:'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Assigned To</div><div class="detail-value">${esc(l.assigned_to||'—')}</div></div>
      <div class="detail-field"><div class="detail-label">Follow-up</div><div class="detail-value">${l.follow_up_date?fmtDate(l.follow_up_date):'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Added</div><div class="detail-value">${fmtDate(l.created_at)}</div></div>
    </div>
    ${l.description?`<div class="detail-section">RFQ Notes</div><div class="detail-value" style="white-space:pre-wrap">${esc(l.description)}</div>`:''}
    ${l.notes?`<div class="detail-section">Internal Notes</div><div class="detail-value" style="white-space:pre-wrap">${esc(l.notes)}</div>`:''}`;
  document.getElementById('detailFooter').innerHTML=`
    <button class="btn btn-cancel" onclick="closeDetail()">Close</button>
    <div class="spacer"></div>
    <button class="btn btn-save" onclick="closeDetail();openLeadModal('${l.id}')">Edit Lead</button>`;
  document.getElementById('detailModal').classList.add('open');
}

// ── Job CRUD ──
function openJobModal(id,preStatus){
  editingJobId=id||null;pendingFile=null;pendingFileUrl=null;pendingFileName=null;
  document.getElementById('fileAttached').style.display='none';
  document.getElementById('fileAttached').innerHTML='';
  document.getElementById('uploadProgress').style.display='none';
  document.getElementById('jobModalTitle').textContent=id?'Edit Job':'New Job';
  document.getElementById('jobFormMsg').className='msg';
  const fields=['job_name','job_number','estimated_value','department','vessel_name','vessel_type','vessel_length','vessel_year','vessel_make','vessel_flag','scope_of_work','notes'];
  if(id){
    const j=allJobs.find(x=>x.id===id);
    if(j){
      fields.forEach(f=>{const el=document.getElementById('jf_'+f);if(el)el.value=j[f]||'';});
      document.getElementById('jf_status').value=j.status||'Approved';
      if(j.proposal_url){pendingFileUrl=j.proposal_url;pendingFileName=j.proposal_filename||'proposal.pdf';document.getElementById('fileAttached').style.display='block';document.getElementById('fileAttached').innerHTML=`<div class="file-attached"><span class="file-name">${esc(pendingFileName)}</span><a href="${j.proposal_url}" target="_blank" style="color:var(--accent);font-size:12px">View</a></div>`;}
    }
  } else {
    fields.forEach(f=>{const el=document.getElementById('jf_'+f);if(el)el.value='';});
    document.getElementById('jf_status').value=preStatus||'Approved';
  }
  document.getElementById('jobModal').classList.add('open');
}
function closeJobModal(){document.getElementById('jobModal').classList.remove('open');pendingFile=null;}
function handleFileSelect(input){
  const file=input.files[0];if(!file)return;
  pendingFile=file;
  document.getElementById('fileAttached').style.display='block';
  document.getElementById('fileAttached').innerHTML=`<div class="file-attached"><span class="file-name">${esc(file.name)}</span><button class="file-remove" onclick="clearFile()">×</button></div>`;
}
function clearFile(){pendingFile=null;pendingFileUrl=null;pendingFileName=null;document.getElementById('fileAttached').style.display='none';document.getElementById('fileAttached').innerHTML='';document.getElementById('proposalFile').value='';}
async function uploadProposal(name){
  if(!pendingFile)return{url:pendingFileUrl,filename:pendingFileName};
  const folder=(name||'general').toLowerCase().replace(/[^a-z0-9]/g,'-').replace(/-+/g,'-');
  const path=`${folder}/${Date.now()}-${pendingFile.name}`;
  document.getElementById('uploadProgress').style.display='block';
  const{data,error}=await sb.storage.from('proposals').upload(path,pendingFile,{upsert:true});
  document.getElementById('uploadProgress').style.display='none';
  if(error){showMsg('jobFormMsg','error','Upload failed: '+error.message);return null;}
  const{data:urlData}=sb.storage.from('proposals').getPublicUrl(path);
  return{url:urlData.publicUrl,filename:pendingFile.name};
}
async function saveJob(){
  const name=document.getElementById('jf_job_name').value.trim();
  if(!name){showMsg('jobFormMsg','error','Job name required.');return;}
  const btn=document.getElementById('jobSaveBtn');btn.disabled=true;btn.textContent='Saving…';
  const upload=await uploadProposal(v('jf_vessel_name')||name);
  if(upload===null){btn.disabled=false;btn.textContent='Save Job';return;}
  const payload={
    job_name:name,job_number:v('jf_job_number'),
    status:v('jf_status')||'Approved',
    estimated_value:v('jf_estimated_value')?parseFloat(v('jf_estimated_value')):null,
    department:v('jf_department'),
    vessel_name:v('jf_vessel_name'),vessel_type:v('jf_vessel_type'),
    vessel_length:v('jf_vessel_length')?parseFloat(v('jf_vessel_length')):null,
    vessel_year:v('jf_vessel_year')?parseInt(v('jf_vessel_year')):null,
    vessel_make:v('jf_vessel_make'),vessel_flag:v('jf_vessel_flag'),
    pm_notes:v('jf_scope_of_work'),admin_notes:v('jf_notes'),
    proposal_url:upload.url||null,proposal_filename:upload.filename||null,
  };
  const{error}=editingJobId?await sb.from('apb_jobs').update(payload).eq('id',editingJobId):await sb.from('apb_jobs').insert(payload);
  btn.disabled=false;btn.textContent='Save Job';
  if(error){showMsg('jobFormMsg','error',error.message);return;}
  closeJobModal();await loadJobs();showToast(editingJobId?'Job updated ✓':'Job added ✓');
}
async function deleteJob(id){
  if(!confirm('Delete this job?'))return;
  await sb.from('apb_jobs').delete().eq('id',id);
  await loadJobs();showToast('Job deleted');
}
function showJobDetail(id){
  const j=allJobs.find(x=>x.id===id);if(!j)return;
  document.getElementById('detailTitle').textContent=j.job_name||j.vessel_name||'Job';
  const statusKey=(j.status||'').toLowerCase().replace(/\s+/g,'').replace('tobeadded','');
  document.getElementById('detailBody').innerHTML=`
    <div class="detail-row">
      <div class="detail-field"><div class="detail-label">Status</div><div class="detail-value"><span class="status-badge badge-${statusKey}">${j.status||'—'}</span></div></div>
      <div class="detail-field"><div class="detail-label">Job Number</div><div class="detail-value" style="font-family:var(--mono)">${esc(j.job_number||'—')}</div></div>
      <div class="detail-field"><div class="detail-label">Vessel</div><div class="detail-value">${esc(j.vessel_name||'—')}</div></div>
      <div class="detail-field"><div class="detail-label">Type / Length</div><div class="detail-value">${[j.vessel_type,j.vessel_length?j.vessel_length+'ft':''].filter(Boolean).join(' · ')||'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Estimated Value</div><div class="detail-value">${j.estimated_value?'$'+Number(j.estimated_value).toLocaleString():'—'}</div></div>
      <div class="detail-field"><div class="detail-label">Department</div><div class="detail-value">${esc(j.department||'—')}</div></div>
      <div class="detail-field"><div class="detail-label">Added</div><div class="detail-value">${fmtDate(j.created_at)}</div></div>
      <div class="detail-field"><div class="detail-label">QuickBooks</div><div class="detail-value">${j.qbo_synced?'<span style="color:var(--green)">✓ Added</span>':'<span style="color:var(--amber)">Not yet added</span>'}</div></div>
      ${j.ms_list_item_id?`<div class="detail-field"><div class="detail-label">SharePoint</div><div class="detail-value"><a href="https://allpointsboats1.sharepoint.com/sites/operations/Lists/Jobs/DispForm.aspx?ID=${j.ms_list_item_id}" target="_blank" style="color:var(--accent)">Open job →</a></div></div>`:''}
    </div>
    ${j.pm_notes?`<div class="detail-section">Scope of Work</div><div class="detail-value" style="white-space:pre-wrap">${esc(j.pm_notes)}</div>`:''}
    ${j.admin_notes?`<div class="detail-section">Notes</div><div class="detail-value" style="white-space:pre-wrap">${esc(j.admin_notes)}</div>`:''}
    ${j.proposal_url?`<div class="detail-section">Proposal</div><div class="proposal-link"><span style="flex:1;font-size:13px;color:var(--ink-2)">${esc(j.proposal_filename||'Proposal')}</span><a href="${j.proposal_url}" target="_blank">View PDF →</a></div>`:''}`;
  document.getElementById('detailFooter').innerHTML=`
    <button class="btn btn-cancel" onclick="closeDetail()">Close</button>
    <div class="spacer"></div>
    ${j.apb_engagements?.name?`<a class="btn btn-ghost" href="${spFolderUrl(j.apb_engagements.name)}" target="_blank">SharePoint ↗</a>`:''}
    <button class="btn ${j.qbo_synced?'btn-ghost':'btn-save'}" onclick="toggleQboSynced('${j.id}',${!j.qbo_synced})">${j.qbo_synced?'Mark Not Added':'Mark Added to QuickBooks ✓'}</button>
    <button class="btn btn-save" onclick="closeDetail();openJobModal('${j.id}')">Edit Job</button>`;
  document.getElementById('detailModal').classList.add('open');
}
async function toggleQboSynced(id,val){
  await sb.from('apb_jobs').update({qbo_synced:val}).eq('id',id);
  await loadJobs();showJobDetail(id);showToast(val?'Marked as added to QuickBooks ✓':'Marked as not yet added');
}
function closeDetail(){document.getElementById('detailModal').classList.remove('open');}

// ── Utils ──
function spFolderUrl(name){const enc=encodeURIComponent(name);return`https://allpointsboats1.sharepoint.com/sites/operations/Lists/Jobs/Grouped%20by%20Project.aspx?FilterField1=Parent%5Fx0020%5FProject&FilterValue1=${enc}&FilterType1=Text&FilterDisplay1=${enc}&viewid=3af2d7b3%2D0ba9%2D4ab5%2Dbed7%2Dbc4bdf461cb9`;}
function v(id){const el=document.getElementById(id);return el?el.value.trim()||null:null;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(d){if(!d)return'';try{return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return'';}}
function showMsg(id,type,text){const el=document.getElementById(id);el.textContent=text;el.className='msg '+type;if(type==='success')setTimeout(()=>el.className='msg',5000);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
// Close modals on backdrop click
document.querySelectorAll('.modal-scrim').forEach(s=>s.addEventListener('click',e=>{if(e.target===s){if(s.id==='leadModal')closeLeadModal();else if(s.id==='jobModal')closeJobModal();else closeDetail();}}));
// Escape key
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLeadModal();closeJobModal();closeDetail();}});

// ── Initial load ──
loadLeads();
loadJobs();
</script>
</body>
</html>
