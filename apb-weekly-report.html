<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="apb-roles.js"></script>
<script src="apb-demo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Report · APB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEEF2;--panel:#fff;--panel-2:#F5F6FA;
  --ink:#0D1626;--ink-2:#3A4559;--ink-3:#6B7A92;
  --line:#DDE1E8;--line-2:#E8EBF0;
  --accent:#2457E6;--accent-2:#1B45B8;--accent-soft:#EAF0FE;
  --green:#0B9E6A;--green-soft:#E4F5EE;
  --amber:#B86A00;--amber-soft:#FBF0E2;
  --red:#C43030;--red-soft:#FDEAEA;
  --shadow-sm:0 1px 3px rgba(13,22,38,.07);
  --shadow:0 8px 28px -12px rgba(13,22,38,.14);
  --mono:"DM Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(14px);display:flex;align-items:center;gap:14px;padding:0 28px;height:62px;border-bottom:1px solid var(--line)}
.topbar img{height:46px;width:auto;display:block}
.topbar .t{border-left:1px solid var(--line);padding-left:14px}
.topbar .t b{font-size:15px}
.topbar .t span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.topbar .sp{flex:1}
.topbar .navbtn{font-size:12.5px;font-weight:600;color:var(--accent);padding:7px 13px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;text-decoration:none;transition:.12s;white-space:nowrap}
.topbar .navbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.role-pill{font-family:var(--mono);font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent-2);letter-spacing:.04em}
.whoami{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3)}
.whoami select{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
.wrap{max-width:920px;margin:0 auto;padding:24px 22px 60px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);padding:20px 22px}
.form-card h2{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.form-card .sub{font-size:12.5px;color:var(--ink-3);margin:0 0 16px}
.wk-pill{font-family:var(--mono);font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent-2)}
.done-pill{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;background:var(--green-soft);color:#0a7a52}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fg label{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.fg .opt{text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:500}
.fg input,.fg select,.fg textarea{font:inherit;font-size:13.5px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);outline:none;transition:.12s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,87,230,.1)}
.fg textarea{resize:vertical;min-height:84px;line-height:1.5}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);transition:.12s;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.prim:hover{background:var(--accent-2);color:#fff}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);padding:15px 18px;border-top:3px solid var(--line)}
.stat .v{font-family:var(--mono);font-size:25px;font-weight:500;line-height:1;letter-spacing:-.02em}
.stat .l{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.stat.in{border-top-color:var(--green)} .stat.in .v{color:var(--green)}
.stat.out{border-top-color:var(--amber)} .stat.out .v{color:var(--amber)}
.stat.tot{border-top-color:var(--accent)} .stat.tot .v{color:var(--accent)}

/* missing panel */
.missing{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:14px;box-shadow:var(--shadow-sm);padding:14px 18px;margin:16px 0 4px}
.missing h3{margin:0 0 10px;font-size:13.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.missing h3 .pill{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--amber-soft);color:var(--amber);padding:2px 9px;border-radius:20px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2)}
.chip.no-email{opacity:.7}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-right:6px;vertical-align:middle}
.all-in{font-size:13px;color:#0a7a52;font-weight:600;display:flex;align-items:center;gap:8px}

.sec{display:flex;align-items:center;gap:12px;margin:28px 2px 14px}
.sec h2{font-size:15px;font-weight:800;letter-spacing:-.02em;margin:0}
.sec .sp{flex:1}
.feed-sel{font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.feed-count{font-size:12px;color:var(--ink-3)}

#feed{display:grid;gap:14px}
.rpt{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);padding:15px 17px;border-left:3px solid var(--accent)}
.rpt-top{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.rpt-av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.rpt-who b{font-size:13.5px;font-weight:700}
.rpt-who .meta{font-size:11.5px;color:var(--ink-3)}
.rpt-wk{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent-2);background:var(--accent-soft);padding:4px 11px;border-radius:20px;white-space:nowrap}
.rpt-block{margin:0 0 10px}
.rpt-block:last-of-type{margin-bottom:0}
.rpt-block .bl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.rpt-block .bt{font-size:13.5px;color:var(--ink);line-height:1.55;margin:0;white-space:pre-wrap}
.rpt-block.blk .bl{color:var(--amber)}
.rpt-actions{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line-2);padding-top:10px}
.ra{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);cursor:pointer;transition:.12s;text-decoration:none}
.ra:hover{border-color:var(--accent);color:var(--accent)}
.ra.edit:hover{border-color:var(--accent);color:var(--accent)}
.ra.del{margin-left:auto}.ra.del:hover{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.empty{text-align:center;padding:48px 20px;color:var(--ink-3)}
.empty svg{width:44px;height:44px;stroke:var(--line);stroke-width:1.5;display:block;margin:0 auto 14px}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(70px);background:#11151c;color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:500;z-index:90;opacity:0;transition:.25s;pointer-events:none}
.toast.show{transform:translateX(-50%);opacity:1}
.toast.green{background:#0a7a52}.toast.red{background:var(--red)}
@media(max-width:680px){.f2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
<link rel="stylesheet" href="apb-theme.css">
</head>
<body>

<header class="topbar">
  <img src="apb-logo.png" alt="APB">
  <div class="t"><b>Weekly Report</b><span>What you got done &amp; team updates</span></div>
  <div class="sp"></div>
  <div class="whoami" id="whoami"></div>
  <span class="role-pill" id="rolePill">—</span>
  <a class="navbtn" href="index.html">⌂ Home</a>
</header>

<main class="wrap">
  <div class="card form-card">
    <h2>Your weekly report <span class="wk-pill" id="weekPill">—</span> <span class="done-pill" id="donePill" style="display:none">✓ submitted</span></h2>
    <p class="sub">A quick recap of what you accomplished this week and anything the company and your colleagues should know. Takes two minutes.</p>

    <div class="f2">
      <div class="fg"><label>Your name *</label>
        <select id="fName"><option value="">— select your name —</option></select>
      </div>
      <div class="fg"><label>Week ending</label>
        <input id="fWeek" readonly>
      </div>
    </div>
    <div class="fg"><label>What I accomplished this week *</label>
      <textarea id="fAcc" placeholder="Jobs completed, milestones hit, what got done…"></textarea>
    </div>
    <div class="fg"><label>Updates for the company &amp; colleagues</label>
      <textarea id="fUpd" placeholder="Anything the team should know — wins, changes, heads-ups, shout-outs…"></textarea>
    </div>
    <div class="f2">
      <div class="fg"><label>Blockers / where I need help <span class="opt">(optional)</span></label>
        <textarea id="fBlk" style="min-height:64px" placeholder="Anything slowing you down…"></textarea>
      </div>
      <div class="fg"><label>Focus for next week <span class="opt">(optional)</span></label>
        <textarea id="fNext" style="min-height:64px" placeholder="Top priorities heading into next week…"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn prim" id="submitBtn" onclick="submitReport()">Submit report</button>
      <span id="formNote" class="feed-count"></span>
    </div>
  </div>

  <div class="stats">
    <div class="stat in"><div class="v" id="stIn">0</div><div class="l">Submitted</div></div>
    <div class="stat out"><div class="v" id="stOut">0</div><div class="l">Not in yet</div></div>
    <div class="stat tot"><div class="v" id="stTot">0</div><div class="l">On the roster</div></div>
  </div>

  <div class="missing" id="missingCard"></div>

  <div class="sec">
    <h2>Reports</h2>
    <span class="sp"></span>
    <select class="feed-sel" id="weekSel" onchange="onWeekChange()"></select>
    <span class="feed-count" id="feedCount"></span>
  </div>
  <div id="feed"></div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ── Supabase (same anon client + {id,data} sync the rest of APB uses) ── */
const SUPABASE_URL='https://aanrxyiocxxndkvkeocv.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhbnJ4eWlvY3h4bmRrdmtlb2N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzcwMjksImV4cCI6MjA5NTY1MzAyOX0.QXBQj9bNKXMh4l0lfe6XO-_0ZoZiiYDy7sypQ2U01bU';
let sb=null; try{ sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false } }); }catch(e){}

const LS='apb_weekly_reports', LS_ME='apb_me';
const role=(window.APBRoles?APBRoles.role():'admin');
let ROSTER=[];              // [{name,email}]
let selWeek=null;           // week_ending currently shown in the feed/stats

function G(id){ return document.getElementById(id); }
function lsGet(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function reports(){ const a=lsGet(LS,[]); return Array.isArray(a)?a:[]; }
function me(){ return localStorage.getItem(LS_ME)||''; }
function setMe(n){ try{ localStorage.setItem(LS_ME,n||''); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function initials(n){ const p=(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase(); }
function slug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }

/* ── week helpers (Mon–Sun week; "week ending" = that week's Friday) ── */
function pad(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pdate(s){ const p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function weekEndingOf(d){ const di=(d.getDay()+6)%7; const f=new Date(d.getFullYear(),d.getMonth(),d.getDate()); f.setDate(f.getDate()+(4-di)); return ymd(f); }
function curWeek(){ return weekEndingOf(new Date()); }
function weekLabelShort(wk){ return pdate(wk).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function weekLabelLong(wk){ return pdate(wk).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}); }
function timeAgo(ts){ if(!ts) return ''; const s=(Date.now()-ts)/1000; if(s<60)return'just now'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; const d=Math.floor(s/86400); if(d<7)return d+'d ago'; return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

/* ── Supabase sync ── */
async function wrUpsert(r){ if(!sb||!r||!r.id) return; try{ await sb.from('apb_weekly_reports').upsert({id:r.id,data:r,updated_at:new Date().toISOString()}); }catch(e){} }
async function wrDelete(id){ if(!sb||!id) return; try{ await sb.from('apb_weekly_reports').delete().eq('id',id); }catch(e){} }
async function syncPull(){
  if(!sb) return;
  try{
    const {data,error}=await sb.from('apb_weekly_reports').select('id,data');
    if(error) return;
    const byId={};
    (data||[]).forEach(x=>{ if(x&&x.data&&x.data.id) byId[x.data.id]=x.data; });
    // push up any local-only drafts (remote wins on conflict)
    reports().forEach(r=>{ if(r&&r.id&&!byId[r.id]){ byId[r.id]=r; wrUpsert(r); } });
    lsSet(LS, Object.values(byId).sort((a,b)=>(b.at||0)-(a.at||0)));
    renderAll();
  }catch(e){}
}

/* ── roster = apb_report_roster (office/leads)  ∪  apb_techs(active) ── */
async function loadRoster(){
  if(!sb){ renderAll(); return; }
  try{
    const results=await Promise.all([
      sb.from('apb_report_roster').select('name,email,active').eq('active',true),
      sb.from('apb_techs').select('name,email,active').eq('active',true)
    ]);
    const rows=[];
    results.forEach(res=>{ if(res && Array.isArray(res.data)) rows.push.apply(rows,res.data); });
    const seen={}, out=[];
    rows.forEach(p=>{
      if(!p || !p.name) return;
      const k=slug(p.name); if(!k || seen[k]) return; seen[k]=1;
      out.push({ name:String(p.name).trim(), email:(p.email||'').trim() });
    });
    out.sort((a,b)=>a.name.localeCompare(b.name));
    if(out.length) ROSTER=out;
  }catch(e){}
  renderAll();
}

/* ── who-am-I select in the topbar ── */
function renderWhoAmI(){
  const opts=['<option value="">— your name —</option>'].concat(
    ROSTER.map(m=>`<option value="${esc(m.name)}" ${m.name===me()?'selected':''}>${esc(m.name)}</option>`)
  ).join('');
  G('whoami').innerHTML='You: <select onchange="pickMe(this.value)">'+opts+'</select>';
  G('rolePill').textContent=window.APBRoles?APBRoles.label():'Admin';
}
function pickMe(n){ setMe(n); renderWhoAmI(); renderForm(); }

/* ── the form ── */
function existingFor(name,wk){ return reports().find(r=>r && r.week_ending===wk && slug(r.name)===slug(name)); }
function renderForm(){
  // name dropdown
  const cur=G('fName').value || me();
  G('fName').innerHTML=['<option value="">— select your name —</option>'].concat(
    ROSTER.map(m=>`<option value="${esc(m.name)}">${esc(m.name)}</option>`)
  ).join('');
  if(cur && ROSTER.some(m=>slug(m.name)===slug(cur))) G('fName').value=ROSTER.find(m=>slug(m.name)===slug(cur)).name;

  const wk=curWeek();
  G('fWeek').value=weekLabelLong(wk);
  G('weekPill').textContent='Week ending '+weekLabelShort(wk);

  const name=G('fName').value;
  const ex=name?existingFor(name,wk):null;
  if(ex){
    G('fAcc').value=ex.accomplishments||'';
    G('fUpd').value=ex.updates_for_team||'';
    G('fBlk').value=ex.blockers||'';
    G('fNext').value=ex.next_week||'';
    G('submitBtn').textContent='Update my report';
    G('donePill').style.display='';
    G('formNote').textContent='You submitted this week '+ (ex.at?timeAgo(ex.at):'') +' — edits overwrite it.';
  }else{
    G('submitBtn').textContent='Submit report';
    G('donePill').style.display='none';
    G('formNote').textContent='';
  }
}

function submitReport(){
  const name=G('fName').value;
  if(!name){ toast('Pick your name','red'); G('fName').focus(); return; }
  const acc=G('fAcc').value.trim();
  if(!acc){ toast('Add what you accomplished','red'); G('fAcc').focus(); return; }
  const wk=curWeek();
  const email=(ROSTER.find(m=>slug(m.name)===slug(name))||{}).email||'';
  const r={
    id:'wr_'+wk+'_'+slug(name),
    name, email, week_ending:wk,
    accomplishments:acc,
    updates_for_team:G('fUpd').value.trim(),
    blockers:G('fBlk').value.trim(),
    next_week:G('fNext').value.trim(),
    at:Date.now(),
    role:(window.APBRoles?APBRoles.role():'')
  };
  const all=reports().filter(x=>x && x.id!==r.id);
  all.unshift(r);
  lsSet(LS,all);
  wrUpsert(r);
  setMe(name);
  selWeek=wk;
  toast('Weekly report saved ✓','green');
  renderWhoAmI(); renderAll();
}

/* ── stats + missing panel (based on the week shown in the selector) ── */
function submittedNames(wk){
  const set={};
  reports().forEach(r=>{ if(r && r.week_ending===wk) set[slug(r.name)]=1; });
  return set;
}
function renderStats(){
  const wk=selWeek||curWeek();
  const sub=submittedNames(wk);
  const inRoster=ROSTER.filter(m=>sub[slug(m.name)]).length;
  G('stIn').textContent=inRoster;
  G('stOut').textContent=Math.max(0,ROSTER.length-inRoster);
  G('stTot').textContent=ROSTER.length;
}
function renderMissing(){
  const wk=selWeek||curWeek();
  const sub=submittedNames(wk);
  const missing=ROSTER.filter(m=>!sub[slug(m.name)]);
  const box=G('missingCard');
  const isCur=(wk===curWeek());
  if(!ROSTER.length){ box.style.display='none'; return; }
  box.style.display='';
  if(!missing.length){
    box.innerHTML='<div class="all-in">✓ Everyone on the roster has submitted for the week ending '+weekLabelShort(wk)+'.</div>';
    return;
  }
  box.innerHTML='<h3>Not submitted yet <span class="pill">'+missing.length+'</span> <span style="font-weight:500;color:var(--ink-3);font-size:12px">· week ending '+weekLabelShort(wk)+(isCur?'':' (past)')+'</span></h3>'
    +'<div class="chips">'+missing.map(m=>`<span class="chip${m.email?'':' no-email'}" title="${m.email?esc(m.email):'no email on file'}"><span class="dot"></span>${esc(m.name)}</span>`).join('')+'</div>';
}

/* ── week selector + feed ── */
function allWeeks(){
  const set={}; set[curWeek()]=1;
  reports().forEach(r=>{ if(r && r.week_ending) set[r.week_ending]=1; });
  return Object.keys(set).sort().reverse();
}
function renderWeekSel(){
  const weeks=allWeeks();
  if(!selWeek || weeks.indexOf(selWeek)<0) selWeek=weeks[0];
  G('weekSel').innerHTML=weeks.map(w=>`<option value="${w}" ${w===selWeek?'selected':''}>Week ending ${weekLabelShort(w)}${w===curWeek()?' (this week)':''}</option>`).join('');
}
function onWeekChange(){ selWeek=G('weekSel').value; renderStats(); renderMissing(); renderFeed(); }

function renderFeed(){
  const wk=selWeek||curWeek();
  const list=reports().filter(r=>r && r.week_ending===wk).sort((a,b)=>(b.at||0)-(a.at||0));
  G('feedCount').textContent=list.length?list.length+' report'+(list.length>1?'s':''):'';
  const feed=G('feed');
  if(!list.length){
    feed.innerHTML='<div class="empty"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4h16v14H8l-4 4z"/></svg><p>No reports for the week ending '+weekLabelShort(wk)+' yet.</p></div>';
    return;
  }
  feed.innerHTML=list.map(r=>{
    const canDel=(role==='admin'||slug(r.name)===slug(me()));
    const block=(label,txt,cls)=> txt ? `<div class="rpt-block ${cls||''}"><div class="bl">${label}</div><p class="bt">${esc(txt)}</p></div>` : '';
    return `<div class="rpt">
      <div class="rpt-top">
        <div class="rpt-av">${initials(r.name)}</div>
        <div class="rpt-who"><b>${esc(r.name)}</b><div class="meta">${r.at?timeAgo(r.at):''}</div></div>
        <span class="rpt-wk">Wk ${esc(weekLabelShort(r.week_ending))}</span>
      </div>
      ${block('Accomplished this week', r.accomplishments)}
      ${block('Updates for the team', r.updates_for_team)}
      ${block('Blockers / needs help', r.blockers, 'blk')}
      ${block('Focus next week', r.next_week)}
      <div class="rpt-actions">
        ${slug(r.name)===slug(me())?'<button class="ra edit" onclick="editMine()">Edit mine ↑</button>':''}
        ${canDel?`<button class="ra del" onclick="delReport('${r.id}')">Delete</button>`:''}
      </div>
    </div>`;
  }).join('');
}
function editMine(){ window.scrollTo({top:0,behavior:'smooth'}); }
function delReport(id){
  if(!confirm('Delete this weekly report?')) return;
  lsSet(LS, reports().filter(r=>r && r.id!==id));
  wrDelete(id);
  renderAll();
  toast('Deleted','red');
}

/* ── render orchestration ── */
function renderAll(){ renderForm(); renderWeekSel(); renderStats(); renderMissing(); renderFeed(); }

let toastT;
function toast(msg,cls){ const el=G('toast'); el.textContent=msg; el.className='toast show'+(cls?' '+cls:''); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600); }

/* ── init ── */
G('fName').addEventListener('change',function(){ renderForm(); });
selWeek=curWeek();
renderWhoAmI(); renderAll();
loadRoster();
syncPull();
</script>
</body>
