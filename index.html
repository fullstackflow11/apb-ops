<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>APB Operations Hub — Retired</title>
<style>
  :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px 16px; box-sizing:border-box; }
  .card { max-width:480px; text-align:center; }
  h1 { font-size:1.4rem; margin:0 0 12px; }
  p { margin:0 0 10px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>APB Operations Hub has been retired</h1>
    <p>This system was shut down on October 21, 2026 and no longer accepts logins, timesheets, or punches.</p>
    <p>All historical records have been archived. Please contact your manager for anything you need from them.</p>
  </div>
</main>
</body>
</html>
