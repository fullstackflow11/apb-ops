<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Off · APB</title>
<script src="apb-roles.js"></script>
<script src="apb-demo.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEEF2;--panel:#fff;--panel-2:#F5F6FA;
  --ink:#0D1626;--ink-2:#3A4559;--ink-3:#6B7A92;
  --line:#DDE1E8;--line-2:#E8EBF0;
  --accent:#2457E6;--accent-2:#1B45B8;--accent-soft:#EAF0FE;
  --green:#0B9E6A;--green-soft:#E4F5EE;
  --amber:#B86A00;--amber-soft:#FBF0E2;
  --orange:#C05300;--orange-soft:#F8E6D8;
  --red:#C43030;--red-soft:#FDEAEA;
  --purple:#6B3DBB;--purple-soft:#F0EBFF;
  --teal:#0E8C8C;--teal-soft:#E0F3F3;
  --shadow-sm:0 1px 3px rgba(13,22,38,.07);
  --shadow:0 8px 28px -12px rgba(13,22,38,.14);
  --mono:"DM Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh}

/* topbar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(14px);display:flex;align-items:center;gap:14px;padding:0 28px;height:62px;border-bottom:1px solid var(--line)}
.topbar img{height:38px;width:auto;display:block}
.topbar .t{border-left:1px solid var(--line);padding-left:14px}
.topbar .t b{font-size:15px}
.topbar .t span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.topbar .sp{flex:1}
.topbar .navbtn{font-size:12.5px;font-weight:600;color:var(--accent);padding:7px 13px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;text-decoration:none;transition:.12s;white-space:nowrap}
.topbar .navbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.role-pill{font-family:var(--mono);font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent-2);letter-spacing:.04em}
.whoami{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3)}
.whoami select{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}

.wrap{max-width:1180px;margin:0 auto;padding:26px 24px 60px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);padding:16px 18px;border-top:3px solid var(--line)}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1;letter-spacing:-.02em}
.stat .l{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.stat.pend{border-top-color:var(--amber)} .stat.pend .v{color:var(--amber)}
.stat.today{border-top-color:var(--accent)} .stat.today .v{color:var(--accent)}
.stat.up{border-top-color:var(--teal)} .stat.up .v{color:var(--teal)}
.stat.mo{border-top-color:var(--green)} .stat.mo .v{color:var(--green)}

.sec{display:flex;align-items:center;gap:12px;margin:6px 2px 16px}
.sec h2{font-size:16px;font-weight:800;letter-spacing:-.02em;margin:0}
.sec .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);transition:.12s;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.prim:hover{background:var(--accent-2);color:#fff}
.btn svg{width:15px;height:15px;stroke-width:2.4}

/* tabs */
.tabs{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.tabs button{font:inherit;font-size:13px;font-weight:600;padding:7px 16px;border:none;border-radius:8px;background:transparent;color:var(--ink-3);cursor:pointer;transition:.12s}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}

/* approvals banner */
.appr{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:14px;box-shadow:var(--shadow-sm);padding:14px 18px;margin-bottom:22px}
.appr h3{margin:0 0 11px;font-size:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.appr h3 .pill{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--amber-soft);color:var(--amber);padding:2px 9px;border-radius:20px}
.areq{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line-2);flex-wrap:wrap}
.areq:first-of-type{border-top:none}
.areq .who{font-weight:700;font-size:13.5px;min-width:130px}
.areq .det{font-size:12.5px;color:var(--ink-2);flex:1;min-width:180px}
.areq .acts{display:flex;gap:6px}
.mini{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);cursor:pointer;transition:.12s}
.mini.ok:hover{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.mini.no:hover{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.mini.view:hover{border-color:var(--accent);color:var(--accent)}

/* calendar */
.cal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden}
.cal-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.cal-head h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;min-width:188px}
.cal-head .sp{flex:1}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-nav button{font:inherit;font-size:15px;font-weight:700;width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink-2);cursor:pointer;transition:.12s;line-height:1}
.cal-nav button:hover{border-color:var(--accent);color:var(--accent)}
.cal-nav .tdy{width:auto;padding:0 13px;font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:11px 16px;border-bottom:1px solid var(--line-2);background:var(--panel-2)}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--panel-2);border-bottom:1px solid var(--line-2)}
.dow span{padding:9px 6px;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.grid-cal{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{min-height:104px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:5px 6px 7px;position:relative;background:var(--panel);cursor:pointer;transition:background .12s}
.cell:nth-child(7n){border-right:none}
.cell:hover{background:var(--panel-2)}
.cell.out{background:#fbfcfd;cursor:default} .cell.out:hover{background:#fbfcfd}
.cell.out .dnum{color:var(--line)}
.cell.wknd{background:#fafbfd}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cell .dnum{font-size:12px;font-weight:700;color:var(--ink-2);display:inline-block}
.cell.today .dnum{color:var(--accent)}
.cell .hol{display:block;font-size:9px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.04em;margin-top:1px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:1px solid transparent;line-height:1.5}
.chip.pending{background:var(--panel)!important;border-style:dashed!important;opacity:.92}
.chip.pending::after{content:" ·?";opacity:.7}
.t-vacation{background:var(--accent-soft);color:var(--accent-2);border-color:#c7d7f8}
.t-sick{background:var(--red-soft);color:var(--red);border-color:#ecc9c6}
.t-personal{background:var(--purple-soft);color:var(--purple);border-color:#d8caf3}
.t-bereavement{background:#eef1f5;color:var(--ink-2);border-color:var(--line)}
.t-jury{background:var(--amber-soft);color:var(--amber);border-color:#e6d6b8}
.t-unpaid{background:var(--orange-soft);color:var(--orange);border-color:#f0d0b8}
.more{display:block;font-size:10px;font-weight:700;color:var(--ink-3);margin-top:3px;padding-left:2px}

/* requests table */
.tablecard{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden}
.fbar{display:flex;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;align-items:center}
.fchip{font-size:12px;font-weight:600;padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer;transition:.12s}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:11px 16px;border-bottom:1px solid var(--line-2);background:var(--panel-2)}
tbody td{padding:12px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--panel-2)}
.tname{font-weight:700}
.tdept{font-size:11.5px;color:var(--ink-3)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;font-family:var(--mono);padding:2px 9px;border-radius:6px;border:1px solid transparent}
.st-pending{background:var(--amber-soft);color:var(--amber);border-color:#e6d6b8}
.st-approved{background:var(--green-soft);color:var(--green);border-color:#bfe6d4}
.st-denied{background:var(--red-soft);color:var(--red);border-color:#ecc9c6}
.rowacts{display:flex;gap:6px;justify-content:flex-end}

.empty{text-align:center;padding:54px 20px;color:var(--ink-3)}
.empty svg{width:46px;height:46px;stroke:var(--line);stroke-width:1.5;display:block;margin:0 auto 14px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(13,22,38,.45);backdrop-filter:blur(2px);display:none;place-items:center;z-index:60;padding:20px}
.modal-bg.open{display:grid}
.modal{background:var(--panel);border-radius:18px;box-shadow:0 24px 60px -20px rgba(13,22,38,.4);width:100%;max-width:520px;padding:26px 26px 22px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 4px;font-size:18px;font-weight:800;letter-spacing:-.02em}
.modal .sub{font-size:12.5px;color:var(--ink-3);margin:0 0 18px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fg label{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.fg input,.fg select,.fg textarea{font:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);outline:none;transition:.12s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,87,230,.1)}
.fg textarea{resize:vertical;min-height:62px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.chkrow{display:flex;align-items:center;gap:9px;margin-bottom:13px;font-size:13px;color:var(--ink-2)}
.chkrow input{width:16px;height:16px;accent-color:var(--accent)}
.calc{font-size:12.5px;color:var(--ink-2);background:var(--accent-soft);border:1px solid #c7d7f8;border-radius:9px;padding:9px 12px;margin-bottom:14px;font-weight:600}
.modal-actions{display:flex;gap:10px;margin-top:8px;padding-top:16px;border-top:1px solid var(--line-2)}
.modal-actions .sp{flex:1}

/* detail modal */
.drow{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.drow:last-of-type{border-bottom:none}
.drow .k{color:var(--ink-3);font-weight:600}
.drow .v{font-weight:600;text-align:right}
.dnote{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--ink-2);margin-top:12px;line-height:1.5}
.daylist .di{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.daylist .di:last-child{border-bottom:none}
.daylist .di:hover{opacity:.7}
.dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(70px);background:#11151c;color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:500;z-index:90;opacity:0;transition:.25s;pointer-events:none}
.toast.show{transform:translateX(-50%);opacity:1}
.toast.green{background:#0a7a52}.toast.red{background:var(--red)}

@media(max-width:880px){.stats{grid-template-columns:1fr 1fr}.f2{grid-template-columns:1fr}.cell{min-height:78px}.cal-head h2{min-width:auto;font-size:15px}}
</style>

<body>

<header class="topbar">
  <img src="apb-logo.png" alt="APB">
  <div class="t"><b>Time Off</b><span>PTO Requests &amp; Calendar</span></div>
  <div class="sp"></div>
  <div class="whoami" id="whoami"></div>
  <span class="role-pill" id="rolePill">—</span>
  <a class="navbtn" href="index.html">⌂ Home</a>
</header>

<main class="wrap">
  <div class="stats" id="stats"></div>

  <div id="apprWrap"></div>

  <div class="sec">
    <div class="tabs">
      <button id="tabCal" class="on" onclick="setTab('cal')">📅 Calendar</button>
      <button id="tabList" onclick="setTab('list')">📋 All Requests</button>
    </div>
    <span class="sp"></span>
    <button class="btn prim" onclick="openReq()"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Request Time Off</button>
  </div>

  <div id="view"></div>
</main>

<!-- Request modal -->
<div class="modal-bg" id="reqModal">
  <div class="modal">
    <h3 id="reqTitle">Request Time Off</h3>
    <p class="sub">Submit your dates — your manager gets it for approval. You'll see the status here.</p>
    <div class="fg">
      <label>Who's it for *</label>
      <input id="rName" list="rosterList" placeholder="Start typing a name…" autocomplete="off">
      <datalist id="rosterList"></datalist>
    </div>
    <div class="f2">
      <div class="fg"><label>Department *</label><select id="rDept"></select></div>
      <div class="fg"><label>Type *</label><select id="rType"></select></div>
    </div>
    <div class="f2">
      <div class="fg"><label>First day *</label><input id="rStart" type="date" onchange="syncDates()"></div>
      <div class="fg"><label>Last day *</label><input id="rEnd" type="date" onchange="recalc()"></div>
    </div>
    <div class="chkrow" id="halfRow"><input id="rHalf" type="checkbox" onchange="recalc()"><label for="rHalf" style="text-transform:none;font-weight:500;letter-spacing:0">Half day only</label></div>
    <div class="calc" id="calcLine">—</div>
    <div class="fg"><label>Reason / notes</label><textarea id="rNotes" placeholder="Optional — e.g. family vacation, doctor, etc."></textarea></div>
    <div class="modal-actions">
      <button class="btn prim" onclick="saveReq()">Submit Request</button>
      <button class="btn" onclick="closeMod('reqModal')">Cancel</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-bg" id="detModal">
  <div class="modal" style="max-width:460px">
    <h3 id="detTitle">Request</h3>
    <p class="sub" id="detSub"></p>
    <div id="detBody"></div>
    <div class="modal-actions" id="detActions"></div>
  </div>
</div>

<!-- Day modal -->
<div class="modal-bg" id="dayModal">
  <div class="modal" style="max-width:420px">
    <h3 id="dayTitle">Day</h3>
    <div id="dayBody" class="daylist"></div>
    <div class="modal-actions"><span class="sp"></span><button class="btn" onclick="closeMod('dayModal')">Close</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LS_PTO='apb_pto', LS_TEAM='apb_team', LS_ME='apb_me';
const DAY=86400000;
const role = (window.APBRoles ? APBRoles.role() : 'admin');
const canApprove = (role==='admin' || role==='pm');

const SEED_TEAM=[
  {name:'Jerry Clark',role:'tech'},{name:'Tommy Borden',role:'tech'},
  {name:'Christian Yancy',role:'tech'},{name:'Jared Sandoval',role:'tech'},
  {name:'Jesse Lopez Sanchez',role:'tech'},{name:'Jordan Mirador',role:'tech'},
  {name:'David Brown',role:'tech'},{name:'Brandon Wezkiewicz',role:'tech'}
];

const DEPTS=['Fabrication / Shop','Welding','Field / Service','Project Management','Office / Admin','Accounting','Purchasing'];

const TYPES={
  vacation:{label:'Vacation'}, sick:{label:'Sick'}, personal:{label:'Personal'},
  bereavement:{label:'Bereavement'}, jury:{label:'Jury Duty'}, unpaid:{label:'Unpaid'}
};

const HOLIDAYS={
  '2026-01-01':"New Year's Day",'2026-01-19':'MLK Day','2026-02-16':"Presidents' Day",
  '2026-05-25':'Memorial Day','2026-06-19':'Juneteenth','2026-07-03':'July 4th (obs.)',
  '2026-09-07':'Labor Day','2026-11-11':'Veterans Day','2026-11-26':'Thanksgiving',
  '2026-11-27':'Day After Thxg','2026-12-25':'Christmas'
};

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// storage helpers
function load(k,f){ try{ return JSON.parse(localStorage.getItem(k)||f); }catch(e){ return JSON.parse(f); } }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function reqs(){ return load(LS_PTO,'[]'); }
function team(){ let t=load(LS_TEAM,'null'); if(!t){ t=SEED_TEAM.slice(); save(LS_TEAM,t); } return t; }
function me(){ return localStorage.getItem(LS_ME)||''; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Shared store (Supabase) — PTO requests sync to apb_pto so every computer sees them ──
const SUPABASE_URL='https://aanrxyiocxxndkvkeocv.supabase.co';
const SUPABASE_KEY='sb_publishable_DzUy57K8eF8I1HeAYrCz3A_G7aEiyCw';
let sb=null; try{ sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){}
async function ptoUpsert(r){ if(!sb||!r||!r.id) return; try{ await sb.from('apb_pto').upsert({id:r.id,status:r.status,data:r,updated_at:new Date().toISOString()}); }catch(e){} }
async function ptoDelete(id){ if(!sb||!id) return; try{ await sb.from('apb_pto').delete().eq('id',id); }catch(e){} }
async function syncPull(){
  if(!sb) return;
  try{
    const {data,error}=await sb.from('apb_pto').select('id,data');
    if(error) return;
    const byId={};
    (data||[]).forEach(x=>{ if(x&&x.data&&x.data.id) byId[x.data.id]=x.data; });
    // migrate any browser-only requests up to the shared table (remote wins on conflicts)
    reqs().forEach(r=>{ if(r&&r.id&&!byId[r.id]){ byId[r.id]=r; ptoUpsert(r); } });
    save(LS_PTO, Object.values(byId));
    render();
  }catch(e){}
}
// Pull the real employee roster from apb_techs so "Who's it for" / "You" show everyone, synced across computers.
async function loadTeam(){
  if(!sb) return;
  try{
    const {data,error}=await sb.from('apb_techs').select('name,active').eq('active',true).order('name');
    if(error||!Array.isArray(data)||!data.length) return;
    save(LS_TEAM, data.map(t=>({name:t.name, role:'tech'})));
    renderWhoAmI();
    const rl=document.getElementById('rosterList'); if(rl) rl.innerHTML=team().map(m=>`<option value="${esc(m.name)}">`).join('');
  }catch(e){}
}

// date helpers (string-keyed, TZ-safe)
function pad(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pdate(s){ const p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function todayKey(){ return ymd(new Date()); }
function fmtRange(a,b){
  const da=pdate(a), db=pdate(b);
  const o={month:'short',day:'numeric'};
  if(a===b) return da.toLocaleDateString('en-US',o);
  const sameMo=da.getMonth()===db.getMonth();
  return da.toLocaleDateString('en-US',o)+' – '+db.toLocaleDateString('en-US',sameMo?{day:'numeric'}:o);
}
function bizDays(r){
  if(r.half && r.start===r.end) return 0.5;
  let d=pdate(r.start), end=pdate(r.end), n=0, guard=0;
  while(d<=end && guard++<800){ const w=d.getDay(); if(w!==0&&w!==6 && !HOLIDAYS[ymd(d)]) n++; d=new Date(d.getTime()+DAY); }
  return n;
}
function coversDay(r,key){ return r.start<=key && key<=r.end; }
function first(n){ return (n||'').split(' ')[0]; }

let tab='cal';
let viewY=new Date().getFullYear(), viewM=new Date().getMonth();

// boot
document.getElementById('rolePill').textContent = window.APBRoles?APBRoles.label():'Admin';
renderWhoAmI();
render();
syncPull();
loadTeam();

function renderWhoAmI(){
  const el=document.getElementById('whoami');
  el.innerHTML='You: <select id="meSel" onchange="setMe(this.value)"><option value="">— your name —</option>'+
    team().map(m=>`<option value="${esc(m.name)}" ${m.name===me()?'selected':''}>${esc(m.name)}</option>`).join('')+'</select>';
}
function setMe(n){ localStorage.setItem(LS_ME,n); toast(n?('Hi, '+first(n)):'Cleared'); }

function setTab(t){ tab=t; document.getElementById('tabCal').classList.toggle('on',t==='cal'); document.getElementById('tabList').classList.toggle('on',t==='list'); render(); }

function render(){ renderStats(); renderApprovals(); document.getElementById('view').innerHTML = tab==='cal'?calendarHTML():listHTML(); }

// ── Stats ───────────────────────────────────────────────
function renderStats(){
  const all=reqs(), tk=todayKey();
  const pending=all.filter(r=>r.status==='pending').length;
  const outToday=all.filter(r=>r.status==='approved' && coversDay(r,tk)).length;
  const in14=ymd(new Date(Date.now()+14*DAY));
  const upcoming=all.filter(r=>r.status==='approved' && r.start>tk && r.start<=in14).length;
  const mo=ymd(new Date(viewY,viewM,1)).slice(0,7);
  let moDays=0;
  all.filter(r=>r.status==='approved').forEach(r=>{ if(r.start.slice(0,7)===mo||r.end.slice(0,7)===mo||(r.start.slice(0,7)<mo&&r.end.slice(0,7)>mo)) moDays+=bizDays(r); });
  document.getElementById('stats').innerHTML=`
    <div class="stat pend"><div class="v">${pending}</div><div class="l">Pending Approval</div></div>
    <div class="stat today"><div class="v">${outToday}</div><div class="l">Out Today</div></div>
    <div class="stat up"><div class="v">${upcoming}</div><div class="l">Next 14 Days</div></div>
    <div class="stat mo"><div class="v">${moDays%1?moDays.toFixed(1):moDays}</div><div class="l">Days · ${MONTHS[viewM].slice(0,3)}</div></div>`;
}

// ── Approvals banner (managers only) ────────────────────
function renderApprovals(){
  const wrap=document.getElementById('apprWrap');
  if(!canApprove){ wrap.innerHTML=''; return; }
  const pend=reqs().filter(r=>r.status==='pending').sort((a,b)=>a.start.localeCompare(b.start));
  if(!pend.length){ wrap.innerHTML=''; return; }
  wrap.innerHTML=`<div class="appr">
    <h3>⏳ Waiting on you <span class="pill">${pend.length} to review</span></h3>
    ${pend.map(r=>`<div class="areq">
      <span class="who">${esc(r.name)}</span>
      <span class="det">${esc(TYPES[r.type]?TYPES[r.type].label:r.type)} · ${esc(fmtRange(r.start,r.end))} · ${bizDays(r)%1?bizDays(r).toFixed(1):bizDays(r)} day${bizDays(r)===1?'':'s'}${r.notes?' · "'+esc(r.notes)+'"':''}</span>
      <span class="acts">
        <button class="mini ok" onclick="decide('${r.id}','approved',event)">✓ Approve</button>
        <button class="mini no" onclick="decide('${r.id}','denied',event)">✕ Deny</button>
        <button class="mini view" onclick="openDetail('${r.id}')">Details</button>
      </span>
    </div>`).join('')}
  </div>`;
}

// ── Calendar ────────────────────────────────────────────
function calendarHTML(){
  const first=new Date(viewY,viewM,1);
  const startDow=first.getDay();
  const daysIn=new Date(viewY,viewM+1,0).getDate();
  const all=reqs().filter(r=>r.status!=='denied');
  const tk=todayKey();

  let cells='';
  // leading blanks
  for(let i=0;i<startDow;i++) cells+=`<div class="cell out"></div>`;
  for(let d=1;d<=daysIn;d++){
    const dt=new Date(viewY,viewM,d), key=ymd(dt), w=dt.getDay();
    const dayReqs=all.filter(r=>coversDay(r,key));
    const hol=HOLIDAYS[key];
    let inner=`<span class="dnum">${d}</span>`;
    if(hol) inner+=`<span class="hol" title="${esc(hol)}">🏖 ${esc(hol)}</span>`;
    const show=dayReqs.slice(0,3);
    inner+=show.map(r=>`<span class="chip t-${r.type} ${r.status}" onclick="openDetail('${r.id}');event.stopPropagation()" title="${esc(r.name)} · ${esc(TYPES[r.type]?TYPES[r.type].label:r.type)}">${esc(first0(r.name))}</span>`).join('');
    if(dayReqs.length>show.length) inner+=`<span class="more">+${dayReqs.length-show.length} more</span>`;
    cells+=`<div class="cell ${(w===0||w===6)?'wknd':''} ${key===tk?'today':''}" onclick="openDay('${key}')">${inner}</div>`;
  }
  // trailing blanks to fill the last week
  const total=startDow+daysIn; const trail=(7-(total%7))%7;
  for(let i=0;i<trail;i++) cells+=`<div class="cell out"></div>`;

  return `<div class="cal">
    <div class="cal-head">
      <h2>${MONTHS[viewM]} ${viewY}</h2>
      <span class="sp"></span>
      <div class="cal-nav">
        <button onclick="nav(-1)" title="Previous month">‹</button>
        <button class="tdy" onclick="navToday()">Today</button>
        <button onclick="nav(1)" title="Next month">›</button>
      </div>
    </div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>Vacation</span>
      <span><i style="background:var(--red)"></i>Sick</span>
      <span><i style="background:var(--purple)"></i>Personal</span>
      <span><i style="background:var(--amber)"></i>Jury</span>
      <span><i style="background:var(--orange)"></i>Unpaid</span>
      <span><i style="background:#aeb6c4"></i>Bereavement</span>
      <span style="margin-left:auto;color:var(--ink-3)">Dashed = pending approval</span>
    </div>
    <div class="dow">${DOW.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="grid-cal">${cells}</div>
  </div>`;
}
function first0(n){ const p=(n||'').trim().split(' '); return p.length>1 ? p[0]+' '+p[1][0]+'.' : (p[0]||'?'); }
function nav(dir){ viewM+=dir; if(viewM<0){viewM=11;viewY--;} if(viewM>11){viewM=0;viewY++;} render(); }
function navToday(){ const n=new Date(); viewY=n.getFullYear(); viewM=n.getMonth(); render(); }

// ── Requests list ───────────────────────────────────────
let listFilter='all';
function setFilter(f){ listFilter=f; render(); }
function listHTML(){
  let all=reqs().slice().sort((a,b)=>b.start.localeCompare(a.start));
  const counts={all:all.length,pending:0,approved:0,denied:0};
  all.forEach(r=>counts[r.status]++);
  if(listFilter!=='all') all=all.filter(r=>r.status===listFilter);
  const chip=(f,l)=>`<button class="fchip ${listFilter===f?'on':''}" onclick="setFilter('${f}')">${l} <b>${counts[f]}</b></button>`;
  const rows = all.length ? all.map(r=>{
    const days=bizDays(r); const d=days%1?days.toFixed(1):days;
    const acts = (canApprove && r.status==='pending')
      ? `<button class="mini ok" onclick="decide('${r.id}','approved',event)">✓</button><button class="mini no" onclick="decide('${r.id}','denied',event)">✕</button>`
      : (canDelete(r)?`<button class="mini no" onclick="cancelReq('${r.id}',event)">Cancel</button>`:'');
    return `<tr onclick="openDetail('${r.id}')">
      <td><div class="tname">${esc(r.name)}</div><div class="tdept">${esc(r.dept||'')}</div></td>
      <td>${esc(TYPES[r.type]?TYPES[r.type].label:r.type)}</td>
      <td>${esc(fmtRange(r.start,r.end))}</td>
      <td>${d}</td>
      <td><span class="badge st-${r.status}">${r.status}</span></td>
      <td><div class="rowacts" onclick="event.stopPropagation()">${acts}</div></td>
    </tr>`;
  }).join('') : `<tr><td colspan="6"><div class="empty"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><p>No requests yet. Hit <b>Request Time Off</b> to add one.</p></div></td></tr>`;
  return `<div class="tablecard">
    <div class="fbar">${chip('all','All')}${chip('pending','Pending')}${chip('approved','Approved')}${chip('denied','Denied')}</div>
    <table><thead><tr><th>Person</th><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}
function canDelete(r){ return role==='admin' || (me() && r.name===me() && r.status==='pending'); }

// ── Request modal ───────────────────────────────────────
function openReq(){
  document.getElementById('rosterList').innerHTML=team().map(m=>`<option value="${esc(m.name)}">`).join('');
  document.getElementById('rDept').innerHTML=DEPTS.map(d=>`<option>${d}</option>`).join('');
  document.getElementById('rType').innerHTML=Object.keys(TYPES).map(k=>`<option value="${k}">${TYPES[k].label}</option>`).join('');
  document.getElementById('rName').value=me()||'';
  // guess dept from roster role
  const t=team().find(m=>m.name===me());
  if(t) document.getElementById('rDept').value = t.role==='pm'?'Project Management':(t.role==='accounting'?'Accounting':(t.role==='purchasing'?'Purchasing':'Fabrication / Shop'));
  document.getElementById('rType').value='vacation';
  const tk=todayKey();
  document.getElementById('rStart').value=tk; document.getElementById('rEnd').value=tk;
  document.getElementById('rHalf').checked=false;
  document.getElementById('rNotes').value='';
  recalc();
  document.getElementById('reqModal').classList.add('open');
  setTimeout(()=>document.getElementById('rName').focus(),50);
}
function syncDates(){ const s=document.getElementById('rStart').value, e=document.getElementById('rEnd').value; if(!e||e<s) document.getElementById('rEnd').value=s; recalc(); }
function recalc(){
  const s=document.getElementById('rStart').value, e=document.getElementById('rEnd').value;
  const half=document.getElementById('rHalf').checked;
  document.getElementById('halfRow').style.display=(s&&s===e)?'flex':'none';
  if(!s||!e){ document.getElementById('calcLine').textContent='Pick your dates above.'; return; }
  const days=bizDays({start:s,end:e,half:(half&&s===e)});
  const d=days%1?days.toFixed(1):days;
  document.getElementById('calcLine').textContent=`${fmtRange(s,e)} · ${d} working day${days===1?'':'s'} (weekends & holidays not counted as work).`;
}
function saveReq(){
  const name=document.getElementById('rName').value.trim();
  if(!name){ toast('Whose time off is this?','red'); return; }
  const s=document.getElementById('rStart').value, e=document.getElementById('rEnd').value;
  if(!s||!e){ toast('Pick start and end dates','red'); return; }
  if(e<s){ toast('Last day is before the first day','red'); return; }
  const half=document.getElementById('rHalf').checked && s===e;
  const r={ id:uid(), name, dept:document.getElementById('rDept').value,
    type:document.getElementById('rType').value, start:s, end:e, half,
    notes:document.getElementById('rNotes').value.trim(),
    status:'pending', submittedBy:(window.APBRoles?APBRoles.label():'')||name, submittedAt:Date.now() };
  // auto-add unknown name to roster so they show up next time
  if(!team().some(m=>m.name.toLowerCase()===name.toLowerCase())){ const t=team(); t.push({name,role:'tech'}); save(LS_TEAM,t); renderWhoAmI(); }
  const all=reqs(); all.push(r); save(LS_PTO,all); ptoUpsert(r);
  closeMod('reqModal'); render(); toast('Request submitted for approval ✓','green');
}

// ── Decisions ───────────────────────────────────────────
function decide(id,status,ev){
  if(ev) ev.stopPropagation();
  const all=reqs(); const r=all.find(x=>x.id===id); if(!r) return;
  let note='';
  if(status==='denied'){ note=prompt('Reason for denying (optional):')||''; }
  r.status=status; r.decidedBy=(window.APBRoles?APBRoles.label():'Manager'); r.decidedAt=Date.now(); if(note) r.decisionNote=note;
  save(LS_PTO,all); ptoUpsert(r); closeMod('detModal'); render();
  toast(status==='approved'?'Approved ✓ — enjoy!':'Request denied', status==='approved'?'green':'red');
}
function cancelReq(id,ev){
  if(ev) ev.stopPropagation();
  if(!confirm('Cancel / delete this request?')) return;
  save(LS_PTO, reqs().filter(r=>r.id!==id)); ptoDelete(id); closeMod('detModal'); render(); toast('Request removed','red');
}

// ── Detail modal ────────────────────────────────────────
function openDetail(id){
  const r=reqs().find(x=>x.id===id); if(!r) return;
  const days=bizDays(r); const d=days%1?days.toFixed(1):days;
  const ytd=reqs().filter(x=>x.name===r.name && x.status==='approved' && x.start.slice(0,4)===String(viewY)).reduce((a,x)=>a+bizDays(x),0);
  document.getElementById('detTitle').textContent=r.name;
  document.getElementById('detSub').textContent=(r.dept||'')+' · '+(TYPES[r.type]?TYPES[r.type].label:r.type);
  document.getElementById('detBody').innerHTML=`
    <div class="drow"><span class="k">Status</span><span class="v"><span class="badge st-${r.status}">${r.status}</span></span></div>
    <div class="drow"><span class="k">Dates</span><span class="v">${esc(fmtRange(r.start,r.end))}${r.half?' (half day)':''}</span></div>
    <div class="drow"><span class="k">Working days</span><span class="v">${d}</span></div>
    <div class="drow"><span class="k">Submitted</span><span class="v">${esc(r.submittedBy||'—')}${r.submittedAt?' · '+new Date(r.submittedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}</span></div>
    ${r.decidedBy?`<div class="drow"><span class="k">${r.status==='approved'?'Approved by':'Decided by'}</span><span class="v">${esc(r.decidedBy)}</span></div>`:''}
    <div class="drow"><span class="k">Approved YTD (${viewY})</span><span class="v">${ytd%1?ytd.toFixed(1):ytd} days</span></div>
    ${r.notes?`<div class="dnote"><b>Note:</b> ${esc(r.notes)}</div>`:''}
    ${r.decisionNote?`<div class="dnote"><b>Manager:</b> ${esc(r.decisionNote)}</div>`:''}`;
  let acts='';
  if(canApprove && r.status==='pending') acts+=`<button class="btn prim" onclick="decide('${r.id}','approved')">✓ Approve</button><button class="btn" onclick="decide('${r.id}','denied')">✕ Deny</button>`;
  if(canApprove && r.status!=='pending') acts+=`<button class="btn" onclick="reopen('${r.id}')">↺ Back to Pending</button>`;
  acts+='<span class="sp"></span>';
  if(canDelete(r)||role==='admin') acts+=`<button class="btn" style="color:var(--red);border-color:#ecc9c6" onclick="cancelReq('${r.id}')">Delete</button>`;
  acts+=`<button class="btn" onclick="closeMod('detModal')">Close</button>`;
  document.getElementById('detActions').innerHTML=acts;
  document.getElementById('detModal').classList.add('open');
}
function reopen(id){ const all=reqs(); const r=all.find(x=>x.id===id); if(!r) return; r.status='pending'; delete r.decidedBy; delete r.decisionNote; save(LS_PTO,all); ptoUpsert(r); closeMod('detModal'); render(); toast('Reopened'); }

// ── Day modal ───────────────────────────────────────────
function openDay(key){
  const dt=pdate(key);
  const list=reqs().filter(r=>r.status!=='denied' && coversDay(r,key));
  const hol=HOLIDAYS[key];
  document.getElementById('dayTitle').textContent=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  let html='';
  if(hol) html+=`<div class="dnote" style="margin-top:0;margin-bottom:12px"><b>🏖 Company holiday:</b> ${esc(hol)}</div>`;
  if(list.length){
    html+=list.map(r=>`<div class="di" onclick="closeMod('dayModal');openDetail('${r.id}')">
      <span class="dot t-${r.type}"></span>
      <span style="flex:1"><b>${esc(r.name)}</b> <span style="color:var(--ink-3);font-size:12px">· ${esc(TYPES[r.type]?TYPES[r.type].label:r.type)}</span></span>
      <span class="badge st-${r.status}">${r.status}</span>
    </div>`).join('');
  } else if(!hol){
    html+=`<p style="color:var(--ink-3);font-size:13.5px;margin:6px 0 4px">Nobody's off this day. <a href="#" onclick="closeMod('dayModal');openReq();return false" style="color:var(--accent);font-weight:600">Request it →</a></p>`;
  }
  document.getElementById('dayBody').innerHTML=html;
  document.getElementById('dayModal').classList.add('open');
}

// ── misc ────────────────────────────────────────────────
function closeMod(id){ document.getElementById(id).classList.remove('open'); }
let toastT;
function toast(msg,cls){ const el=document.getElementById('toast'); el.textContent=msg; el.className='toast show'+(cls?' '+cls:''); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600); }
document.querySelectorAll('.modal-bg').forEach(bg=>bg.addEventListener('click',e=>{ if(e.target===bg) bg.classList.remove('open'); }));
</script>
