<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Access Required · APB</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="apb-theme.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,-apple-system,"Segoe UI",sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px}
.card{background:var(--steel-face);border:1px solid var(--steel-edge);box-shadow:var(--steel-bevel);border-radius:20px;max-width:460px;width:100%;padding:42px 38px;text-align:center;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--accent)}
.lock{width:62px;height:62px;border-radius:16px;margin:0 auto 22px;display:grid;place-items:center;background:linear-gradient(165deg,#FDFDFC,#E7E9E5);border:1px solid var(--steel-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(20,25,28,.12);color:var(--accent-2)}
.lock svg{width:28px;height:28px;stroke-width:2}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:10px}
h1{font-size:23px;font-weight:800;letter-spacing:-.03em;margin:0 0 10px}
p{color:var(--ink-3);font-size:13.5px;line-height:1.6;margin:0 0 26px}
p b{color:var(--ink-2);font-weight:600}
.btns{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;border:1px solid var(--steel-edge);transition:.13s}
.btn.prim{background:linear-gradient(180deg,#147F9E,#0C5E76);border-color:#0A4F63;color:#F2FBFC;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px -8px rgba(14,110,140,.7)}
.btn.prim:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.ghost{background:var(--steel-face);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.foot{margin-top:20px;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.foot code{font-family:var(--mono);font-size:11px;background:var(--panel-2);padding:1px 6px;border-radius:4px}
</style>
</head>
<body>
  <div class="card">
    <div class="lock">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="eyebrow">All Points Boats · Restricted</div>
    <h1 id="title">Access Restricted</h1>
    <p id="msg">This area is limited.</p>
    <div class="btns">
      <a class="btn prim" id="switchBtn" href="#">Continue</a>
      <a class="btn ghost" href="index.html">← Back to Home</a>
    </div>
    <div class="foot">Access on the deployed site follows the <b>account permissions</b> set on the company site.</div>
  </div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  // Same-folder filename only — relative (host-independent) and prevents open-redirect/path traversal.
  var to = params.get('to') || 'index.html';
  if(!/^[A-Za-z0-9%._-]+\.html$/.test(to)) to = 'index.html';
  var need = params.get('need') === 'pm' ? 'pm' : 'admin';
  var needLabel = need === 'pm' ? 'PM' : 'Admin';
  var label = (params.get('label') || 'this area').replace(/[<>]/g,'');

  document.getElementById('title').textContent = needLabel + ' Access Required';
  document.getElementById('msg').innerHTML = 'The <b>' + label + '</b> area is limited to <b>' + needLabel + '</b> users and above.';
  var btn = document.getElementById('switchBtn');
  btn.textContent = 'Switch to ' + needLabel + ' & continue';
  btn.addEventListener('click', function(e){
    e.preventDefault();
    try { localStorage.setItem('apb_role', need); } catch(_){}
    location.replace(to);
  });
})();
</script>
</body>
</html>
